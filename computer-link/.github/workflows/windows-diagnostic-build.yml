name: Experimental diagnostic test-build (known selection test failure)
on:
  push:
    branches: [review/windows-transport]
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - shell: pwsh
        run: |
          rustup toolchain install 1.99.1 --profile minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo +1.99.1 test --locked --manifest-path windows-transport/Cargo.toml -- --test-threads=1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo +1.99.1 test --locked --manifest-path windows-workspace/Cargo.toml -- --test-threads=1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            cargo +1.99.1 test --locked --manifest-path windows-owner/Cargo.toml --lib --bins --test gui -- --test-threads=1
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Package explicitly experimental tested binaries
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $out = Join-Path $env:RUNNER_TEMP 'computer-link-diagnostic-build'
          New-Item -ItemType Directory -Path $out -ErrorAction Stop | Out-Null
          foreach ($name in @('computer-link-owner-proof.exe', 'local-client.exe')) {
            Copy-Item -LiteralPath (Join-Path 'windows-owner/target/debug' $name) -Destination $out -ErrorAction Stop
          }
          Copy-Item -LiteralPath 'windows-owner/DIAGNOSTIC-BUILD.txt' -Destination $out
          $files = @(Get-ChildItem -LiteralPath $out -File | Sort-Object Name | ForEach-Object {
            @{ name = $_.Name; bytes = $_.Length; sha256 = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant() }
          })
          @{ source_commit = $env:GITHUB_SHA; run_id = $env:GITHUB_RUN_ID; profile = 'debug'; status = 'diagnostic intended status-test scope; file-read UI remains enabled; selection acceptance FAILED; not installer or dot connection'; files = $files } | ConvertTo-Json -Depth 5 | Set-Content -LiteralPath (Join-Path $out 'IDENTITY.json') -Encoding utf8
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: computer-link-diagnostic-known-selection-failure
          path: ${{ runner.temp }}/computer-link-diagnostic-build/
          if-no-files-found: error
          retention-days: 7

