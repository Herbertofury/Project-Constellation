name: Windows synthetic local MCP acceptance
on:
  push:
    branches: [review/windows-setup]
    paths: ['mcp-session/**', 'windows-owner/**', 'windows-transport/**', 'windows-workspace/**', '.github/workflows/windows-mcp.yml']
permissions:
  contents: read
jobs:
  synthetic-local-only:
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - shell: pwsh
        run: |
          rustup toolchain install 1.99.1 --profile minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:CARGO_TARGET_DIR = Join-Path $env:RUNNER_TEMP "computer-link-probe-target"
          cargo +1.99.1 build --locked --manifest-path mcp-session/Cargo.toml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo +1.99.1 test --locked --manifest-path mcp-session/Cargo.toml -- --test-threads=1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - shell: pwsh
        run: |
          $env:CARGO_TARGET_DIR = Join-Path $env:RUNNER_TEMP "computer-link-probe-target"
          cargo +1.99.1 test --locked --manifest-path windows-owner/Cargo.toml --test probe_gui -- --ignored --test-threads=1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
# Source tests only: no secrets, install, external endpoint, upload or release artifact.
