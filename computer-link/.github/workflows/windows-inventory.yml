name: Windows inventory source-test acceptance
on:
  push:
    branches: [review/windows-inventory]
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - shell: pwsh
        run: |
          rustup toolchain install 1.99.1 --profile minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo +1.99.1 test --locked --manifest-path windows-owner/Cargo.toml --lib --bins --test gui -- --test-threads=1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
