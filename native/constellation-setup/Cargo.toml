[package]
name = "constellation-setup"
version = "0.22.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"
description = "Current-user Windows installer for Project Constellation"

[dependencies]
constellation-monitor = { path = "../constellation-monitor" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sha2 = "=0.10.9"

[target.'cfg(windows)'.dependencies]
windows = { version = "=0.62.2", features = [
  "Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Security", "Win32_System_Com",
  "Win32_System_Console", "Win32_System_DataExchange", "Win32_System_LibraryLoader",
  "Win32_System_Memory", "Win32_System_Registry", "Win32_System_Threading",
  "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse",
] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
