name: Apply v0.14.7 verified patch

on:
  push:
    branches:
      - feat/v0.14.7-runway-sentinel
    paths:
      - .pc-v0147-ready

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply exact verified patch
        shell: bash
        run: |
          set -euo pipefail
          cat .pc-v0147-chunk-* > /tmp/v0147.b64
          base64 -d /tmp/v0147.b64 > /tmp/v0147.patch.xz
          echo "aa74e9f348cccc438594129db3b5f4df4e29b5b459fc46214edaf2364ba49ae7  /tmp/v0147.patch.xz" | sha256sum -c -
          xz -dc /tmp/v0147.patch.xz > /tmp/v0147.patch
          echo "c6827deb1efb130403d2681d3cf2332e70c5a05c79038460dd6511a87b7ee280  /tmp/v0147.patch" | sha256sum -c -
          git apply --check /tmp/v0147.patch
          git apply /tmp/v0147.patch
          rm .pc-v0147-ready .pc-v0147-chunk-*
          rm .github/workflows/apply-v0147-patch.yml
          git add -A
          git diff --cached --check
          git config user.name "Project Constellation CI"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "v0.14.7: Runway Sentinel"
          git push origin "HEAD:${GITHUB_REF_NAME}"
