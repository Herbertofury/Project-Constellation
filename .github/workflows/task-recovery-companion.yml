name: Task Recovery Companion
on:
  push:
    branches: ["fix/task-recovery-companion-20260923"]
    paths:
      - "tools/chatgpt-ui-rescue/browser-companion/**"
      - "tools/chatgpt-ui-rescue/companion-tests/**"
      - "tools/chatgpt-ui-rescue/BROWSER-COMPANION.md"
      - ".github/workflows/task-recovery-companion.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: task-recovery-companion-${{ github.ref }}
  cancel-in-progress: false
jobs:
  browser-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Syntax and controller regression tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tools/chatgpt-ui-rescue/companion-evidence
          for file in tools/chatgpt-ui-rescue/browser-companion/*.js; do node --check "$file"; done
          node --test tools/chatgpt-ui-rescue/companion-tests/policy.cjs tools/chatgpt-ui-rescue/companion-tests/controller.cjs | tee tools/chatgpt-ui-rescue/companion-evidence/unit-controller.tap
      - name: Install isolated browser test runtime
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
          python -c 'from playwright.sync_api import sync_playwright; import os; p=sync_playwright().start(); f=open(os.environ["GITHUB_ENV"],"a"); f.write("CHROMIUM_EXECUTABLE="+p.chromium.executable_path+"\n"); f.close(); p.stop()'
      - name: Production DOM adapter regressions
        shell: bash
        run: |
          set -euo pipefail
          python tools/chatgpt-ui-rescue/companion-tests/dom_regression.py | tee tools/chatgpt-ui-rescue/companion-evidence/dom.log
      - name: Native installed extension recovery proof
        shell: bash
        run: |
          set -euo pipefail
          python tools/chatgpt-ui-rescue/companion-tests/native_extension_smoke.py | tee tools/chatgpt-ui-rescue/companion-evidence/native-extension.log
      - name: Preserve verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: task-recovery-companion-evidence
          path: tools/chatgpt-ui-rescue/companion-evidence/
          if-no-files-found: error
          retention-days: 30
  existing-project-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install existing browser-test dependencies
        run: |
          python -m pip install -r requirements-dev.txt playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Existing project verification
        run: |
          npm ci
          npm run verify
