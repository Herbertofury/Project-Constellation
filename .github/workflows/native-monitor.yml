name: Constellation Rust browser monitor

on:
  workflow_call:
    secrets:
      PROJECT_CONSTELLATION_GOOGLE_CLIENT_ID:
        required: false
      PROJECT_CONSTELLATION_GITHUB_CLIENT_ID:
        required: false
  workflow_dispatch:
  pull_request:
    paths:
      - 'native/constellation-monitor/**'
      - 'extension/**'
      - 'tests/**'
      - 'tools/**'
      - 'package.json'
      - '.github/workflows/native-monitor.yml'
  push:
    branches: [main, 'release/**', 'upgrade/**']
    paths:
      - 'native/constellation-monitor/**'
      - 'extension/**'
      - 'tests/**'
      - 'tools/**'
      - 'package.json'
      - '.github/workflows/native-monitor.yml'

permissions:
  contents: read

jobs:
  native-transport:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      RUSTFLAGS: ${{ matrix.os == 'windows-latest' && '-C target-feature=+crt-static' || '' }}
    defaults:
      run:
        working-directory: native/constellation-monitor
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: {node-version: 24}
      - uses: actions/setup-python@v7
        with: {python-version: '3.12'}
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.99.0 --profile minimal --component rustfmt --component clippy
      - name: Formatting
        run: cargo +1.99.0 fmt --all --check
      - name: Static analysis
        run: cargo +1.99.0 clippy --locked --all-targets -- -D warnings
      - name: Real native stdio and broker tests
        run: cargo +1.99.0 test --locked --all-targets
      - name: Build portable companion
        run: cargo +1.99.0 build --release --locked
      - name: Build browser packages
        working-directory: .
        shell: bash
        env:
          PROJECT_CONSTELLATION_GOOGLE_CLIENT_ID: ${{ secrets.PROJECT_CONSTELLATION_GOOGLE_CLIENT_ID }}
          PROJECT_CONSTELLATION_GITHUB_CLIENT_ID: ${{ secrets.PROJECT_CONSTELLATION_GITHUB_CLIENT_ID }}
        run: |
          build_args=(--mode=production)
          if [[ -z "$PROJECT_CONSTELLATION_GOOGLE_CLIENT_ID" || -z "$PROJECT_CONSTELLATION_GITHUB_CLIENT_ID" ]]; then
            build_args+=(--allow-unprovisioned-oauth)
          fi
          node tools/build.mjs "${build_args[@]}"
          node tools/build-browser-sensors.mjs
          python tools/package-agent-monitor.py --require-native
      - uses: actions/upload-artifact@v7
        with:
          name: constellation-monitor-${{ matrix.os }}
          path: |
            native/constellation-monitor/target/release/constellation-monitor
            native/constellation-monitor/target/release/constellation-monitor.exe
            build/monitor-artifacts/**
            native/constellation-monitor/README.md
            native/constellation-monitor/PROTOCOL.md
          if-no-files-found: error


  browser-monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: {node-version: 24}
      - uses: actions/setup-python@v7
        with: {python-version: '3.12'}
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m playwright install --with-deps chromium firefox
      - run: npm test
      - run: npm run validate
      - run: npm run build:dev
      - run: npm run build:sensors
      - name: Actual browser rendering and detector fixtures
        env:
          PROJECT_CONSTELLATION_ROOT: ${{ github.workspace }}/extension
          PROJECT_CONSTELLATION_BUILD: ${{ github.workspace }}/build/unpacked
        run: |
          python tests/smoke/agent_monitor_smoke.py
          python tests/smoke/attention_detection_smoke.py
          python tests/smoke/approval_recovery_smoke.py
          python tests/smoke/browser_monitor_sensor_smoke.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: constellation-monitor-browser-evidence
          path: logs/smoke/
          if-no-files-found: warn
