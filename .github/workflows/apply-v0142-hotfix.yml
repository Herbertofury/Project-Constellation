name: Apply v0.14.2 live sentinel hotfix

on:
  push:
    branches: [hotfix/v0.14.2-live-sentinel]
    paths:
      - '.github/workflows/apply-v0142-hotfix.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: hotfix/v0.14.2-live-sentinel
      - name: Reconstruct and apply reviewed patch
        shell: bash
        run: |
          cat .github/hotfix/v0142.patch.xz.b64.* | base64 -d | xz -d > /tmp/v0142.patch
          git apply --check /tmp/v0142.patch
          git apply /tmp/v0142.patch
          rm -rf .github/hotfix .github/workflows/apply-v0142-hotfix.yml
          git config user.name "Project Constellation Hotfix"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "Fix ChatGPT live activity detection with Live Sentinel"
          git push origin HEAD:hotfix/v0.14.2-live-sentinel
