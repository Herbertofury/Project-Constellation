name: Apply v0.14.6 Context Lens

on:
  push:
    branches: [feature/v0.14.6-context-lens]
    paths:
      - '.github/workflows/apply-v0146-context-lens.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: feature/v0.14.6-context-lens
      - name: Verify and apply reviewed v0.14.6 patch
        shell: bash
        run: |
          set -euo pipefail
          : > /tmp/v0146.b64
          for part in .github/hotfix/v0146.seg.00 .github/hotfix/v0146.seg.01 .github/hotfix/v0146.seg.02 .github/hotfix/v0146.seg.03 .github/hotfix/v0146.seg.04 .github/hotfix/v0146.seg.05 .github/hotfix/v0146.seg.06 .github/hotfix/v0146.seg.07; do tr -d '\r\n ' < "$part" >> /tmp/v0146.b64; done
          base64 -d /tmp/v0146.b64 | xz -d > /tmp/v0146.patch
          echo '0ddefdf1ce98468dbc03aa9d7f8504d27b6614ff9e3f1e0c85887bee7d6b2a65  /tmp/v0146.patch' | sha256sum -c -
          git apply --check /tmp/v0146.patch
          git apply /tmp/v0146.patch
          rm -rf .github/hotfix .github/workflows/apply-v0146-context-lens.yml
          git config user.name 'Project Constellation Hotfix'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git status --short
          git commit -m 'v0.14.6: add Pulse Context Lens'
          git push origin HEAD:feature/v0.14.6-context-lens
