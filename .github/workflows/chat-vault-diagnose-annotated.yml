name: Chat Vault Diagnose Annotated

on:
  push:
    branches:
      - feature/chat-vault-pulse-rename-decorations
  workflow_dispatch:

permissions:
  contents: read

jobs:
  npm-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Run npm test with visible failure annotation
        shell: bash
        run: |
          set +e
          npm test > npm-test.log 2>&1
          code=$?
          set -e
          if [ "$code" -ne 0 ]; then
            message=$(tail -n 80 npm-test.log | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')
            echo "::error title=Project Constellation npm test failure::$message"
            exit "$code"
          fi
          cat npm-test.log
