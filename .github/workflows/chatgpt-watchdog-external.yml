name: ChatGPT Watchdog External Monitor

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "watchdog/**"
      - ".github/workflows/chatgpt-watchdog-external.yml"

permissions:
  contents: read
  issues: write

concurrency:
  group: chatgpt-watchdog-external
  cancel-in-progress: false

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CHATGPT_STALE_MINUTES: "240"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-node@v7
        with: { node-version: '26.13.1' }
      - uses: actions/setup-python@v7
        with: { python-version: '3.12' }

      - name: Verify audit and incident decisions
        run: |
          node --test tests/external-scheduler-recovery.test.mjs
          python -m unittest discover -s tests -p test_external_scheduler_rescue.py -v

      - name: Validate current committed audit with hourly-monitor threshold
        run: python watchdog/external_scheduler_rescue.py --threshold-source hours --out logs/external-watchdog/health.json

      - name: Reconcile the independent audit incident
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('node:fs');
            const path = require('node:path');
            const { pathToFileURL } = require('node:url');
            const { reportAuditIncident } = await import(pathToFileURL(path.resolve('watchdog/external_scheduler_recovery.mjs')).href);
            const health = JSON.parse(fs.readFileSync('logs/external-watchdog/health.json', 'utf8'));
            let report;
            try { report = await reportAuditIncident({ github, context, health }); }
            catch (error) {
              report = { outcome: 'failed', reason: Number.isInteger(error.status) ? `GitHub HTTP ${error.status}` : 'GitHub request failed' };
            }
            fs.writeFileSync('logs/external-watchdog/result.json', JSON.stringify(report, null, 2) + '\n');
            if (report.outcome === 'failed') core.setFailed('Independent audit incident could not be fully reconciled. See retained evidence.');
            await core.summary.addHeading('Independent committed-audit monitor')
              .addRaw(`Audit state: ${health.scheduler_state}. Age: ${health.heartbeat_age_minutes ?? 'unavailable'} minutes. Outcome: ${report.outcome}.\n`)
              .addRaw('This is committed audit evidence, not current ChatGPT service-health or recovery proof.\n').write();

      - name: Preserve current audit evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: external-watchdog-${{ github.run_id }}-${{ github.run_attempt }}
          path: logs/external-watchdog/*.json
          if-no-files-found: warn
          retention-days: 30
