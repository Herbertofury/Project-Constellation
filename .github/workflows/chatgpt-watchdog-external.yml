name: ChatGPT Watchdog External Monitor

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate ChatGPT watchdog heartbeat
        id: heartbeat
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone

          path = "watchdog/heartbeat.json"
          stale_hours = 4.0
          state = "healthy"
          detail = ""

          try:
              with open(path, "r", encoding="utf-8") as f:
                  data = json.load(f)
              stamp = data["last_ok_utc"]
              last = datetime.fromisoformat(stamp.replace("Z", "+00:00"))
              age_h = (datetime.now(timezone.utc) - last.astimezone(timezone.utc)).total_seconds() / 3600
              stale_hours = float(data.get("stale_after_hours", stale_hours))
              if age_h > stale_hours:
                  state = "stale"
                  detail = f"Heartbeat age {age_h:.2f}h exceeds threshold {stale_hours:.2f}h. Last OK: {stamp}."
              else:
                  detail = f"Heartbeat healthy. Age {age_h:.2f}h, threshold {stale_hours:.2f}h. Last OK: {stamp}."
          except Exception as exc:
              state = "broken"
              detail = f"Heartbeat validation failed: {type(exc).__name__}: {exc}"

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"state={state}\n")
              out.write("detail<<EOF\n")
              out.write(detail + "\n")
              out.write("EOF\n")
          print(state, detail)
          PY

      - name: Open or refresh stale-heartbeat issue
        if: steps.heartbeat.outputs.state != 'healthy'
        uses: actions/github-script@v7
        with:
          script: |
            const title = "[Watchdog] ChatGPT scheduled-task heartbeat stale";
            const detail = ${JSON.stringify(steps.heartbeat.outputs.detail)};
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              per_page: 100,
            });
            const existing = issues.find(i => i.title === title);
            const body = [
              "The external GitHub monitor detected a stale or malformed ChatGPT watchdog heartbeat.",
              "",
              detail,
              "",
              "Recovery source: `watchdog/recovery-controller.json` and `watchdog/recovery-protocol.md`.",
              "The next healthy ChatGPT watchdog/project run should consume this incident, repair live automation state, checkpoint the result, and refresh the heartbeat.",
              "",
              "This issue contains no credentials or secrets."
            ].join("\n");
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
              });
            }

      - name: Close stale-heartbeat issue after recovery
        if: steps.heartbeat.outputs.state == 'healthy'
        uses: actions/github-script@v7
        with:
          script: |
            const title = "[Watchdog] ChatGPT scheduled-task heartbeat stale";
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              per_page: 100,
            });
            for (const issue of issues.filter(i => i.title === title)) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: "Heartbeat is healthy again. Closing the external recovery incident."
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: "closed",
                state_reason: "completed",
              });
            }
