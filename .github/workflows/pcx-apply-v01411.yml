name: Apply v0.14.11 frozen patch

on:
  push:
    branches:
      - feat/v0.14.11-early-branch-guard
    paths:
      - .pcx-stage/v0.14.11/READY

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out staging head
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Reconstruct and verify frozen patch
        shell: bash
        run: |
          set -euo pipefail
          base64 -d .pcx-stage/v0.14.11/part-00.b64 > /tmp/pcx-v01411.part-00
          base64 -d .pcx-stage/v0.14.11/part-01.b64 > /tmp/pcx-v01411.part-01
          cat /tmp/pcx-v01411.part-00 /tmp/pcx-v01411.part-01 > /tmp/pcx-v01411.patch.xz
          test "$(wc -c < /tmp/pcx-v01411.patch.xz)" -eq 17780
          echo "5eda968e92ff53ca5fa393c5ae8ce3bc5c92bfe10b672cbc0c2e6f7cf9247d4d  /tmp/pcx-v01411.patch.xz" | sha256sum -c -
          xz -dc /tmp/pcx-v01411.patch.xz > /tmp/pcx-v01411.patch
          test "$(wc -c < /tmp/pcx-v01411.patch)" -eq 79541
          echo "3fea27a696af0df6146dee041ce37169d0ab10c0429f2ba6dd3a4c389476af8a  /tmp/pcx-v01411.patch" | sha256sum -c -
          git apply --check /tmp/pcx-v01411.patch

      - name: Apply exact source and remove staging bridge
        shell: bash
        run: |
          set -euo pipefail
          git apply /tmp/pcx-v01411.patch
          rm -rf .pcx-stage/v0.14.11
          rm -f .github/workflows/pcx-apply-v01411.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check -- . ':(exclude)brain/v0.14.11/HANDOFF.md' ':(exclude)docs/v0.14.11-release-notes.md'
          git commit -m "v0.14.11: Early Branch Guard"
          git push origin "HEAD:${GITHUB_REF_NAME}"
