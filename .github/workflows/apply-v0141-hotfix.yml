name: Apply v0.14.1 live pulse hotfix

on:
  push:
    branches:
      - hotfix/v0.14.1-live-pulse
    paths:
      - '.github/workflows/apply-v0141-hotfix.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hotfix/v0.14.1-live-pulse
          fetch-depth: 0
      - name: Reconstruct and apply reviewed patch
        shell: bash
        run: |
          set -euo pipefail
          cat .pcx-hotfix/part*.b64 | base64 -d | gunzip > /tmp/v0141.patch
          echo '61647d8e13ec529ee4105f49c7af7e66972874c63f81384844c3791abf461f81  /tmp/v0141.patch' | sha256sum -c -
          git apply --check /tmp/v0141.patch
          git apply /tmp/v0141.patch
          git config user.name 'Project Constellation Hotfix'
          git config user.email 'actions@users.noreply.github.com'
          git add CHANGELOG.md docs/v0.14.1-release-notes.md extension package.json package-lock.json tests/smoke
          git commit -m 'Fix live multi-tab Chat Pulse and editable branch handoff'
          git push origin HEAD:hotfix/v0.14.1-live-pulse
