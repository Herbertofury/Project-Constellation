name: Project Constellation Portable

on:
  push:
    branches: [pcx-029-pc-bridge]
    paths:
      - 'pc-buddy/**'
      - 'extension/manifest.json'
      - 'extension/src/service-worker.js'
      - 'extension/src/local-companion-background.js'
      - 'extension/src/project-constellation-companion.js'
      - '.github/workflows/pc-buddy-portable.yml'
  pull_request:
    paths:
      - 'pc-buddy/**'
      - 'extension/manifest.json'
      - 'extension/src/service-worker.js'
      - 'extension/src/local-companion-background.js'
      - 'extension/src/project-constellation-companion.js'
      - '.github/workflows/pc-buddy-portable.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-portable:
    runs-on: windows-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v5

      - name: Enforce ChatGPT-session transport
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (Test-Path 'pc-buddy/Core/OpenAiBuddyClient.cs') { throw 'Billable OpenAI API client must not exist in Project Constellation.' }
          if (Test-Path 'pc-buddy/Core/SecretStore.cs') { throw 'API-key secret store must not exist in Project Constellation.' }
          $source = Get-ChildItem 'pc-buddy' -Recurse -File | Where-Object { $_.Extension -in '.cs', '.xaml', '.csproj' }
          $hits = $source | Select-String -Pattern 'api\.openai\.com|OPENAI_API_KEY|/v1/responses'
          if ($hits) {
            $hits | ForEach-Object { Write-Host $_ }
            throw 'Billable OpenAI API transport string found in Project Constellation source.'
          }

      - name: Validate browser companion extension
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          node --check extension/src/service-worker.js
          node --check extension/src/local-companion-background.js
          node --check extension/src/project-constellation-companion.js
          node -e "const fs=require('fs'); const m=JSON.parse(fs.readFileSync('extension/manifest.json','utf8')); if(m.name!=='Project Constellation'||m.version!=='0.16.0') process.exit(2); if(m.background?.service_worker!=='src/service-worker.js') process.exit(3); if(!m.host_permissions?.includes('http://127.0.0.1:17342/*')) process.exit(4); const scripts=(m.content_scripts||[]).flatMap(x=>x.js||[]); if(!scripts.includes('src/project-constellation-companion.js')) process.exit(5);"

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore pc-buddy/PCBuddy.csproj

      - name: Compile release
        run: dotnet build pc-buddy/PCBuddy.csproj -c Release --no-restore

      - name: Publish self-contained app
        run: >-
          dotnet publish pc-buddy/PCBuddy.csproj
          -c Release
          -r win-x64
          --self-contained true
          --no-restore
          -p:PublishSingleFile=true
          -p:EnableCompressionInSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=embedded
          -p:ContinuousIntegrationBuild=true
          -o build/project-constellation

      - name: Run packaged executable self-test
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = Join-Path $PWD 'build/project-constellation/ProjectConstellation.exe'
          if (-not (Test-Path $exe)) { throw 'Published ProjectConstellation.exe was not produced.' }
          $proc = Start-Process -FilePath $exe -ArgumentList '--self-test' -WorkingDirectory (Split-Path $exe) -Wait -PassThru
          $receipt = Join-Path $PWD 'build/project-constellation/project-constellation-self-test.json'
          if (-not (Test-Path $receipt)) { throw 'Self-test receipt was not produced.' }
          Get-Content $receipt
          if ($proc.ExitCode -ne 0) { throw "Project Constellation self-test failed with exit code $($proc.ExitCode)" }
          $parsed = Get-Content $receipt -Raw | ConvertFrom-Json
          if (-not $parsed.passed) { throw 'Self-test receipt did not report passed=true.' }
          if ($parsed.app -ne 'Project Constellation') { throw 'Self-test receipt has stale product identity.' }
          if ($parsed.transport -ne 'chatgpt_web_session' -or $parsed.apiKeyRequired -ne $false) {
            throw 'Self-test receipt does not prove the no-API ChatGPT-session transport.'
          }
          if ($parsed.browserCompanion -ne 'loopback_tokenized') {
            throw 'Self-test receipt does not prove the tokenized loopback browser companion.'
          }
          $browserRoundtrip = $parsed.results | Where-Object { $_.test -eq 'browser_companion.tool_roundtrip' }
          if (-not $browserRoundtrip -or -not $browserRoundtrip.ok) {
            throw 'Self-test did not prove a browser-companion tool round trip.'
          }

      - name: Run packaged WebView2 bridge DOM smoke
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = Join-Path $PWD 'build/project-constellation/ProjectConstellation.exe'
          $receipt = Join-Path $PWD 'build/project-constellation/project-constellation-bridge-dom-smoke.json'
          $proc = Start-Process -FilePath $exe -ArgumentList '--bridge-dom-smoke' -WorkingDirectory (Split-Path $exe) -PassThru
          if (-not $proc.WaitForExit(30000)) {
            try { $proc.Kill($true) } catch {}
            if (Test-Path $receipt) { Get-Content $receipt }
            throw 'Project Constellation WebView2 bridge DOM smoke did not exit within 30 seconds.'
          }
          if (Test-Path $receipt) { Get-Content $receipt }
          if ($proc.ExitCode -ne 0) { throw "Project Constellation WebView2 bridge DOM smoke failed with exit code $($proc.ExitCode)" }
          if (-not (Test-Path $receipt)) { throw 'WebView2 bridge DOM smoke receipt was not produced.' }
          $parsed = Get-Content $receipt -Raw | ConvertFrom-Json
          if (-not $parsed.passed -or -not $parsed.sessionStateObserved -or -not $parsed.toolCallObserved -or -not $parsed.sendInjected -or -not $parsed.internalHidden) {
            throw 'WebView2 bridge DOM smoke did not prove the complete bridge script flow.'
          }

      - name: Run packaged WPF UI launch smoke
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = Join-Path $PWD 'build/project-constellation/ProjectConstellation.exe'
          $receipt = Join-Path $PWD 'build/project-constellation/project-constellation-ui-smoke.json'
          $proc = Start-Process -FilePath $exe -ArgumentList '--ui-smoke' -WorkingDirectory (Split-Path $exe) -PassThru
          if (-not $proc.WaitForExit(20000)) {
            try { $proc.Kill($true) } catch {}
            if (Test-Path $receipt) { Get-Content $receipt }
            throw 'Project Constellation UI smoke did not exit within 20 seconds.'
          }
          if (Test-Path $receipt) { Get-Content $receipt }
          if ($proc.ExitCode -ne 0) { throw "Project Constellation UI smoke failed with exit code $($proc.ExitCode)" }
          if (-not (Test-Path $receipt)) { throw 'UI smoke receipt was not produced.' }
          $parsed = Get-Content $receipt -Raw | ConvertFrom-Json
          if (-not $parsed.passed) { throw 'UI smoke receipt did not report passed=true.' }
          if ($parsed.window.Title -ne 'Project Constellation') { throw 'Rendered window title is not Project Constellation.' }

      - name: Assemble portable package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $package = Join-Path $PWD 'build/package'
          New-Item -ItemType Directory -Force -Path $package | Out-Null
          $exe = Join-Path $PWD 'build/project-constellation/ProjectConstellation.exe'
          if (-not (Test-Path $exe)) { throw 'Published ProjectConstellation.exe was not produced.' }
          Copy-Item $exe (Join-Path $package 'Project Constellation.exe')
          Copy-Item 'pc-buddy/README.md' (Join-Path $package 'README.txt')
          Copy-Item 'build/project-constellation/project-constellation-self-test.json' (Join-Path $package 'SELF-TEST-RECEIPT.json')
          Copy-Item 'build/project-constellation/project-constellation-bridge-dom-smoke.json' (Join-Path $package 'BRIDGE-DOM-SMOKE-RECEIPT.json')
          Copy-Item 'build/project-constellation/project-constellation-ui-smoke.json' (Join-Path $package 'UI-SMOKE-RECEIPT.json')
          Copy-Item 'extension' (Join-Path $package 'Browser Extension') -Recurse
          $hashLines = @()
          $exeHash = (Get-FileHash (Join-Path $package 'Project Constellation.exe') -Algorithm SHA256).Hash.ToLowerInvariant()
          $hashLines += "$exeHash *Project Constellation.exe"

          $loaderCandidates = @(
            (Join-Path $PWD 'build/project-constellation/WebView2Loader.dll'),
            (Join-Path $PWD 'build/project-constellation/runtimes/win-x64/native/WebView2Loader.dll')
          )
          $loader = $loaderCandidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if ($loader) {
            Copy-Item $loader (Join-Path $package 'WebView2Loader.dll')
            $loaderHash = (Get-FileHash (Join-Path $package 'WebView2Loader.dll') -Algorithm SHA256).Hash.ToLowerInvariant()
            $hashLines += "$loaderHash *WebView2Loader.dll"
            Write-Host "WebView2Loader sidecar emitted and packaged: $loaderHash"
          } else {
            Write-Host 'No WebView2Loader sidecar emitted; packaged WebView2 DOM smoke already proved the published single EXE can instantiate WebView2.'
          }

          $manifestHash = (Get-FileHash (Join-Path $package 'Browser Extension/manifest.json') -Algorithm SHA256).Hash.ToLowerInvariant()
          $hashLines += "$manifestHash *Browser Extension/manifest.json"
          $hashLines | Set-Content -Encoding ascii (Join-Path $package 'SHA256SUMS.txt')
          $zip = Join-Path $PWD 'Project-Constellation-Portable-win-x64.zip'
          if (Test-Path $zip) { Remove-Item $zip -Force }
          Compress-Archive -Path (Join-Path $package '*') -DestinationPath $zip -CompressionLevel Optimal
          if ((Get-Item $zip).Length -lt 1MB) { throw 'Portable ZIP is unexpectedly small.' }
          Write-Host "Portable ZIP: $zip"
          Write-Host "EXE SHA256: $exeHash"
          Write-Host "Extension manifest SHA256: $manifestHash"

      - name: Upload portable artifact
        uses: actions/upload-artifact@v5
        with:
          name: Project-Constellation-Portable-win-x64
          path: build/package/*
          if-no-files-found: error
          retention-days: 30
