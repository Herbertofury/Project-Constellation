name: Apply v0.14.11 final patch

on:
  push:
    branches:
      - feat/v0.14.11-early-branch-guard-final
    paths:
      - '.github/workflows/pcx-apply-v01411-final.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Reconstruct and verify frozen patch
        shell: bash
        run: |
          set -euo pipefail
          cat .pcx-stage/v0.14.11/part-00.b64 \
              .pcx-stage/v0.14.11/part-01.b64 \
              .pcx-stage/v0.14.11/part-02.b64 \
              .pcx-stage/v0.14.11/part-03.b64 > /tmp/pcx-v01411.b64
          base64 -d /tmp/pcx-v01411.b64 > /tmp/pcx-v01411.patch.xz
          echo 'f8e27b00a4cf4d1d3cb48d532773573934e0834dd21681bcfa412d9898f5f27e  /tmp/pcx-v01411.patch.xz' | sha256sum -c -
          xz -dc /tmp/pcx-v01411.patch.xz > /tmp/pcx-v01411.patch
          echo '8d9c6e99292ee7a72a4a59ae6860b8c378a5839565577bc2530ebfe024b5b3ae  /tmp/pcx-v01411.patch' | sha256sum -c -
          git apply --check /tmp/pcx-v01411.patch
          git apply /tmp/pcx-v01411.patch
      - name: Commit only real v0.14.11 source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .pcx-stage/v0.14.11
          rm -f .github/workflows/pcx-apply-v01411-final.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git status --short
          git commit -m 'v0.14.11: Early Branch Guard'
          git push origin HEAD:feat/v0.14.11-early-branch-guard-final
