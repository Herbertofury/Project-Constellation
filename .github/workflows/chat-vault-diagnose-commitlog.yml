name: Chat Vault Diagnose Commit Log

on:
  push:
    branches:
      - feature/chat-vault-pulse-rename-decorations
  workflow_dispatch:

permissions:
  contents: write

jobs:
  npm-test:
    if: github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[diag-log]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Run and persist npm test failure
        shell: bash
        run: |
          mkdir -p diagnostics/chat-vault
          set +e
          npm test > diagnostics/chat-vault/npm-test.log 2>&1
          code=$?
          set -e
          echo "$code" > diagnostics/chat-vault/npm-test.exit
          if [ "$code" -ne 0 ]; then
            git config user.name 'Project Constellation CI'
            git config user.email 'actions@users.noreply.github.com'
            git add diagnostics/chat-vault/npm-test.log diagnostics/chat-vault/npm-test.exit
            git commit -m 'ci: capture npm test failure [diag-log]'
            git push origin HEAD:feature/chat-vault-pulse-rename-decorations
            exit "$code"
          fi
          rm -rf diagnostics/chat-vault
