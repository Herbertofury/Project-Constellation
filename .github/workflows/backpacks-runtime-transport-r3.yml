name: Backpacks Forge Runtime Transport R3

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/backpacks-runtime-transport-r3.yml"

permissions:
  contents: read

jobs:
  build-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MCROOT: ${{ runner.temp }}/minecraft
      OUT: ${{ github.workspace }}/transport
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare runtime directories
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$MCROOT" "$OUT/core/minecraft/assets" "$OUT/core/game"
          printf '{"profiles":{},"settings":{},"version":3}\n' > "$MCROOT/launcher_profiles.json"

      - name: Install vanilla Minecraft 1.20.1
        shell: bash
        run: |
          set -euxo pipefail
          python3 -m pip install --disable-pip-version-check minecraft-launcher-lib
          python3 - <<'PY'
          import os
          import minecraft_launcher_lib
          minecraft_launcher_lib.install.install_minecraft_version('1.20.1', os.environ['MCROOT'])
          PY

      - name: Download Forge 47.4.23 installer
        shell: bash
        run: |
          set -euxo pipefail
          curl -fL --retry 3 --retry-delay 2 -o "$RUNNER_TEMP/forge-installer.jar" https://maven.minecraftforge.net/net/minecraftforge/forge/1.20.1-47.4.23/forge-1.20.1-47.4.23-installer.jar
          test -s "$RUNNER_TEMP/forge-installer.jar"

      - name: Install Forge 47.4.23 client
        shell: bash
        run: |
          set -euxo pipefail
          java -jar "$RUNNER_TEMP/forge-installer.jar" --installClient "$MCROOT"

      - name: Package runtime core
        shell: bash
        run: |
          set -euxo pipefail
          cp -a "$MCROOT/libraries" "$OUT/core/minecraft/"
          cp -a "$MCROOT/versions" "$OUT/core/minecraft/"
          cp -a "$MCROOT/launcher_profiles.json" "$OUT/core/minecraft/"
          if [ -d "$MCROOT/assets/indexes" ]; then cp -a "$MCROOT/assets/indexes" "$OUT/core/minecraft/assets/"; fi
          if [ -d "$MCROOT/assets/log_configs" ]; then cp -a "$MCROOT/assets/log_configs" "$OUT/core/minecraft/assets/"; fi
          mkdir -p "$OUT/core/minecraft/assets/objects"
          MODS=$(java --list-modules | cut -d@ -f1 | paste -sd, -)
          jlink --add-modules "$MODS" --strip-debug --no-man-pages --no-header-files --compress=2 --output "$OUT/core/jre17"
          python3 - <<'PY'
          import json, os
          import minecraft_launcher_lib
          root = os.environ['MCROOT']
          out = os.path.join(os.environ['OUT'], 'core')
          installed = minecraft_launcher_lib.utils.get_installed_versions(root)
          forge = [v['id'] for v in installed if '47.4.23' in v['id'] and 'forge' in v['id'].lower()]
          if not forge:
              raise SystemExit(f'Forge version not found; installed={installed!r}')
          version = forge[0]
          java = os.path.realpath(os.path.join(os.environ['JAVA_HOME'], 'bin', 'java'))
          game = os.path.join(root, 'game')
          os.makedirs(game, exist_ok=True)
          opts = {'username':'QAPlayer','uuid':'00000000000000000000000000000001','token':'0','launcherName':'BackpacksQA','launcherVersion':'1','gameDirectory':game,'executablePath':java,'customResolution':True,'resolutionWidth':'1280','resolutionHeight':'720'}
          cmd = minecraft_launcher_lib.command.get_minecraft_command(version, root, opts)
          templated = [a.replace(java, '{JAVA}').replace(root, '{MCROOT}') for a in cmd]
          with open(os.path.join(out, 'launch-command.json'), 'w', encoding='utf-8') as f: json.dump(templated, f, indent=2)
          with open(os.path.join(out, 'forge-version.txt'), 'w', encoding='utf-8') as f: f.write(version + '\n')
          print('FORGE_VERSION', version)
          print('LAUNCH_COMMAND', templated)
          PY
          tar -C "$OUT" -czf "$GITHUB_WORKSPACE/backpacks-runtime-core.tar.gz" core

      - name: Pack asset object shards
        shell: bash
        run: |
          set -euxo pipefail
          for g in 0-3 4-7 8-b c-f; do
            case "$g" in 0-3) dirs="0 1 2 3" ;; 4-7) dirs="4 5 6 7" ;; 8-b) dirs="8 9 a b" ;; c-f) dirs="c d e f" ;; esac
            present=""
            for d in $dirs; do [ -d "$MCROOT/assets/objects/$d" ] && present="$present $d"; done
            test -n "$present"
            tar -C "$MCROOT/assets/objects" -czf "$OUT/assets-$g.tar.gz" $present
          done
          sha256sum "$GITHUB_WORKSPACE/backpacks-runtime-core.tar.gz" "$OUT"/assets-*.tar.gz > "$GITHUB_WORKSPACE/backpacks-runtime-sha256.txt"
          du -sh "$MCROOT" "$OUT/core" "$OUT"/assets-*.tar.gz "$GITHUB_WORKSPACE/backpacks-runtime-core.tar.gz"

      - name: Upload runtime core
        uses: actions/upload-artifact@v4
        with:
          name: backpacks-runtime-core-r3
          path: |
            backpacks-runtime-core.tar.gz
            backpacks-runtime-sha256.txt
          compression-level: 0
          retention-days: 1
      - name: Upload assets 0-3
        uses: actions/upload-artifact@v4
        with:
          name: backpacks-assets-0-3-r3
          path: transport/assets-0-3.tar.gz
          compression-level: 0
          retention-days: 1
      - name: Upload assets 4-7
        uses: actions/upload-artifact@v4
        with:
          name: backpacks-assets-4-7-r3
          path: transport/assets-4-7.tar.gz
          compression-level: 0
          retention-days: 1
      - name: Upload assets 8-b
        uses: actions/upload-artifact@v4
        with:
          name: backpacks-assets-8-b-r3
          path: transport/assets-8-b.tar.gz
          compression-level: 0
          retention-days: 1
      - name: Upload assets c-f
        uses: actions/upload-artifact@v4
        with:
          name: backpacks-assets-c-f-r3
          path: transport/assets-c-f.tar.gz
          compression-level: 0
          retention-days: 1
