name: APD native 10s video
on:
  push:
    branches: [apd-video-run]
    paths:
      - '.github/workflows/apd-native-video.yml'
      - 'apd-video/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Decode source frame
        shell: bash
        run: |
          cat apd-video/source.b64.00 apd-video/source.b64.01 apd-video/source.b64.02 apd-video/source.b64.03 | base64 -d > apd-video/source.jpg
          test -s apd-video/source.jpg
          file apd-video/source.jpg
          sha256sum apd-video/source.jpg
      - name: Install client and ffmpeg
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python -m pip install --upgrade pip
          python -m pip install gradio_client
      - name: Generate two native Wan2.2 clips
        shell: bash
        run: python apd-video/generate.py
      - name: Upload video artifact
        uses: actions/upload-artifact@v4
        with:
          name: apd-10s-native-i2v
          path: |
            apd-video/output/apd-10s-native-i2v.mp4
            apd-video/output/ffprobe.json
            apd-video/output/clip1.mp4
            apd-video/output/clip2.mp4
          if-no-files-found: error
          retention-days: 7
