name: Project Constellation v0.16.0 final publish

on:
  push:
    branches:
      - release/v0.16.0-final
    paths:
      - '.release-final/v0.16.0.txt'

concurrency:
  group: project-constellation-v016-final-publish
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  actions: read
  checks: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      GH_TOKEN: ${{ github.token }}
      FEATURE_BRANCH: feature/chat-vault-pulse-rename-decorations
      BASE_BRANCH: feat/v0.16.0-living-project-rooms-safe-router
      FINAL_BRANCH: release/v0.16.0-final
      VERSION: 0.16.0
      TAG: v0.16.0
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Prepare exact clean v0.16 release tree
        shell: bash
        run: |
          set -euo pipefail
          sleep 20
          git fetch origin "$FEATURE_BRANCH" "$BASE_BRANCH"
          git reset --hard "origin/$FEATURE_BRANCH"
          FEATURE_START="$(git rev-parse HEAD)"
          printf '%s\n' "$FEATURE_START" > /tmp/feature-start

          git config user.name 'Project Constellation Final Publisher'
          git config user.email 'actions@users.noreply.github.com'
          git merge --no-commit --no-ff "origin/$BASE_BRANCH" || true

          cat > package.json <<'JSON'
          {
            "name": "project-constellation-extension",
            "version": "0.16.0",
            "private": true,
            "type": "module",
            "scripts": {
              "test": "node tests/core.test.mjs && node tests/brain-core.test.mjs && node tests/provider-core.test.mjs && node tests/integrity-core.test.mjs && node tests/knowledge-core.test.mjs && node tests/project-memory-core.test.mjs && node tests/project-router-core.test.mjs && node tests/health-core.test.mjs && node tests/live-state-policy.test.mjs && node tests/navigation-safety.test.mjs && node tests/interruption-safety.test.mjs && node tests/tab-group-convergence.test.mjs && node tests/chat-vault-core.test.mjs && node tests/command-center-action-core.test.mjs && node tests/closed-chat-watch-core.test.mjs && node tests/closed-chat-watch-runtime-static.test.mjs && node tests/closed-chat-vault-bridge-static.test.mjs && node tests/command-center-actions-runtime.test.mjs && node tests/popup-attention-qol.test.mjs && node tests/chat-vault-static.test.mjs && node tests/ui-qol-static.test.mjs && node tests/tab-supervisor-core.test.mjs && node tests/reliability-supervisor-contract.test.mjs",
              "validate": "node tools/validate.mjs && node tools/ui-contract.mjs && node tools/message-contract.mjs",
              "build": "node tools/build.mjs --mode=production",
              "build:dev": "node tools/build.mjs --mode=development",
              "package": "node tools/package-release.mjs",
              "package:dev": "node tools/package-release.mjs --allow-development",
              "test:smoke": "node tools/run-smokes.mjs",
              "verify": "npm test && npm run validate && npm run build:dev && npm run test:smoke",
              "test:live-browser": "python3 tools/live_browser_acceptance.py",
              "test:scale": "node tests/project-scale.test.mjs"
            }
          }
          JSON

          cat > extension/manifest.json <<'JSON'
          {
            "manifest_version": 3,
            "name": "Project Constellation",
            "version": "0.16.0",
            "minimum_chrome_version": "116",
            "description": "AI Command Center with Living Project Rooms, browser-wide ChatGPT reliability supervision, stale/dead chat rescue, concurrent Approval Autopilot, Chat Vault, Capacity Guard, project continuity, and verified remote checkpoints.",
            "key": "",
            "permissions": ["storage","sidePanel","tabs","alarms","identity","unlimitedStorage","idle","offscreen","webRequest","scripting","notifications","tabGroups","contextMenus"],
            "optional_permissions": ["downloads","history"],
            "optional_host_permissions": ["https://api.github.com/*","https://www.googleapis.com/*","https://github.com/*"],
            "host_permissions": ["https://chatgpt.com/*","https://chat.openai.com/*","https://claude.ai/*","https://gemini.google.com/*","https://grok.com/*","https://chat.deepseek.com/*","https://perplexity.ai/*","https://www.perplexity.ai/*","https://copilot.microsoft.com/*","https://chat.mistral.ai/*","https://poe.com/*","https://meta.ai/*","https://www.meta.ai/*","https://chat.qwen.ai/*","https://kimi.com/*","https://www.kimi.com/*","https://character.ai/*","https://www.character.ai/*","https://huggingface.co/*","https://you.com/*","https://www.you.com/*","https://pi.ai/*","https://www.pi.ai/*","https://duck.ai/*"],
            "oauth2": {"client_id":"PROJECT_CONSTELLATION_GOOGLE_OAUTH_CLIENT_ID.apps.googleusercontent.com","scopes":["https://www.googleapis.com/auth/drive.file"]},
            "background": {"service_worker":"background-entry.js","type":"module"},
            "action": {"default_title":"Project Constellation","default_popup":"popup.html"},
            "side_panel": {"default_path":"sidepanel.html"},
            "content_scripts": [
              {"matches":["https://chatgpt.com/*","https://chat.openai.com/*"],"js":["src/chatgpt-page-probe.js"],"run_at":"document_start","world":"MAIN"},
              {"matches":["https://chatgpt.com/*","https://chat.openai.com/*","https://claude.ai/*","https://gemini.google.com/*","https://grok.com/*","https://chat.deepseek.com/*","https://perplexity.ai/*","https://www.perplexity.ai/*","https://copilot.microsoft.com/*","https://chat.mistral.ai/*","https://poe.com/*","https://meta.ai/*","https://www.meta.ai/*","https://chat.qwen.ai/*","https://kimi.com/*","https://www.kimi.com/*","https://character.ai/*","https://www.character.ai/*","https://huggingface.co/chat/*","https://you.com/*","https://www.you.com/*","https://pi.ai/*","https://www.pi.ai/*","https://duck.ai/*"],"js":["src/core.js","src/brain-core.js","src/provider-core.js","src/health-core.js","src/live-sentinel.js","src/tab-beacon.js","src/content.js","src/pulse-ux.js","src/tab-supervisor-core.js","src/tab-supervisor.js"],"css":["src/styles.css"],"run_at":"document_start"},
              {"matches":["https://chatgpt.com/*","https://chat.openai.com/*"],"js":["src/chat-vault-core.js","src/chat-organizer.js"],"css":["src/chat-organizer.css"],"run_at":"document_idle"}
            ]
          }
          JSON

          if [ -f tools/live_browser_acceptance_v2.py ]; then
            mv tools/live_browser_acceptance_v2.py tools/live_browser_acceptance.py
          fi

          rm -rf diagnostics .integration .release .release-final .pc-v016
          rm -f \
            .github/workflows/pr21-v016-integration.yml \
            .github/workflows/pr21-v016-integration-v2.yml \
            .github/workflows/pr21-live-browser-diagnostic.yml \
            .github/workflows/live-browser-diagnostic-commit.yml \
            .github/workflows/v016-full-release-transaction.yml \
            .github/workflows/v016-final-publish.yml

          mkdir -p docs
          cat > docs/v0.16.0-release-notes.md <<'MD'
          # Project Constellation v0.16.0 — Living Project Rooms + AI Command Center + Reliability Supervisor

          Project Constellation v0.16.0 is a functional reliability and workflow release. It combines Living Project Rooms + Safe Router with the first-party AI Command Center, Chat Vault/organizer QoL, adaptive closed-chat continuity, durable notifications, and a browser-wide Reliability Supervisor that manages every already-open ChatGPT tab rather than only the foreground tab.

          ## Highlights
          - **Living Project Rooms + Safe Router** — project-aware routing and continuity with scale coverage through 500 projects / 10,000 chats.
          - **AI Command Center** — projects, search, live/saved views, Gather, Open Missing, import/export backup, native ChatGPT rename, and local emoji/color/text styling.
          - **Chat Vault + no-dead-button QoL** — closed-chat vault bridging, organizer workflows, explicit dialog ownership, duplicate-tab prevention, stale Focus fallback, visible disabled states, and truthful busy/refresh feedback.
          - **Browser-wide Reliability Supervisor** — every already-open ChatGPT tab is supervised independently, including hidden/background tabs. A service-worker heartbeat probes every tab, requires a real Supervisor v1 heartbeat, and hot-injects the agent when missing.
          - **Two-hour stale rescue + interruption rescue** — when Refresh Recovery is enabled, explicit delivery/connection/response/send failures, corroborated dead/stalled states, and unresolved running/user turns with no meaningful progress for two hours can be checkpointed, reloaded in the same tab, and continued automatically.
          - **Continuity-safe resume** — the continuation prompt preserves objective, decisions, project/repository/file/Drive/GitHub identities, paths, hashes, run/job IDs, verified tests, blockers, no-repeat history, and the exact unfinished next action; it treats the final attempted side effect as possibly partial and requires verification before repeating it.
          - **Concurrent Approval Autopilot** — Drive/GitHub/connector permission scans fan out across all open ChatGPT tabs concurrently while actual clicks remain owned by the established tested in-page recovery handler.
          - **Earlier capacity warnings** — authoritative `capacity-watch`, `capacity-handoff`, and `capacity-reached` Sentinel states, including tool/structured-message pressure, are promoted before simple turn/character fallback thresholds.
          - **Better project tracking** — ChatGPT `/g/g-p-*` routes and visible project-sidebar entries are mirrored as first-class project identities from every supervised tab.
          - **Adaptive closed-chat heartbeat** — bounded observation of provider-persisted progress for supported providers without hidden duplicate provider sessions, permanent intervals, or unbounded watchdog loops.
          - **Durable notifications** — completion and attention transitions survive MV3 service-worker suspension and focus the relevant chat when clicked.

          ## Recovery safety
          - Automatic ChatGPT reload-and-continue requires the existing Refresh Recovery switch.
          - Only an already-open unfinished conversation can be automatically reloaded; Constellation never creates or focuses a missing chat for passive recovery.
          - Completed idle chats are excluded.
          - Auth-required, unavailable, rate-limited, and approval-blocked states are not blindly refreshed.
          - Per-chat cooldown and attempt caps prevent recovery loops.
          - A non-empty composer is never overwritten.
          - Stash/close still verifies persisted vault state before removing tabs.

          ## Release verification
          Publication is fail-closed on the combined project-router, Command Center/QoL, reliability, validation/UI/message contract, development build, browser-smoke, 500-project/10,000-chat scale, and installed-Chromium acceptance gates.

          Reliability-specific browser proof loads the packaged extension by its stable ID, round-trips a real runtime message, opens two ChatGPT-origin tabs, leaves one in the background, proves Supervisor v1 is alive in both, forces both into stale unfinished state, and requires both tabs to reload and actually submit the continuation prompt.

          Installed Chromium acceptance remains real unpacked-extension browser acceptance; it is not a claim that a user's signed-in local Chrome profile or authenticated provider account was exercised in CI.
          MD

          git add -A
          conflicts="$(git diff --name-only --diff-filter=U)"
          if [ -n "$conflicts" ]; then
            echo 'Unexpected unresolved conflicts:'
            echo "$conflicts"
            exit 1
          fi
          git diff --check
          test "$(node -p "require('./package.json').version")" = '0.16.0'
          test "$(node -p "require('./extension/manifest.json').version")" = '0.16.0'
          test "$(node -p "require('./extension/manifest.json').background.service_worker")" = 'background-entry.js'
          test -f extension/src/project-router-core.js
          test -f tests/project-scale.test.mjs
          test -f extension/src/closed-chat-watch.js
          test -f extension/src/closed-chat-vault-bridge.js
          test -f extension/src/ui-qol.js
          test -f extension/src/tab-supervisor-core.js
          test -f extension/src/tab-supervisor-background.js
          test -f extension/src/approval-supervisor-background.js
          test -f extension/src/tab-supervisor.js
          test -f tests/tab-supervisor-core.test.mjs
          test -f tests/reliability-supervisor-contract.test.mjs
          test -f tests/smoke/multitab_reliability_smoke.py
          test -f tools/live_browser_acceptance.py
          grep -q 'LIVE_BROWSER_ACCEPTANCE_OK' tools/live_browser_acceptance.py

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m venv .venv
      - run: .venv/bin/python -m pip install -r requirements-dev.txt
      - run: .venv/bin/python -m playwright install --with-deps chromium

      - name: Exact-tree full Verify
        run: npm run verify

      - name: Exact-tree scale gate
        run: npm run test:scale

      - name: Exact-tree installed Chromium acceptance
        shell: bash
        run: xvfb-run -a .venv/bin/python -u tools/live_browser_acceptance.py

      - name: Commit the exact accepted tree and advance PR head safely
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code
          git add -A
          git diff --cached --check
          ACCEPTED_TREE="$(git write-tree)"
          if git diff --cached --quiet; then
            echo 'Accepted tree already committed.'
          else
            git commit -m 'Finalize Project Constellation v0.16.0'
          fi
          FINAL_SHA="$(git rev-parse HEAD)"
          FINAL_TREE="$(git show -s --format=%T HEAD)"
          test "$FINAL_TREE" = "$ACCEPTED_TREE"
          echo "FINAL_SHA=$FINAL_SHA" >> "$GITHUB_ENV"
          echo "FINAL_TREE=$FINAL_TREE" >> "$GITHUB_ENV"
          git push origin HEAD:"$FINAL_BRANCH"

          git fetch origin "$FEATURE_BRANCH"
          FEATURE_START="$(cat /tmp/feature-start)"
          FEATURE_NOW="$(git rev-parse "origin/$FEATURE_BRANCH")"
          if [ "$FEATURE_NOW" != "$FEATURE_START" ]; then
            echo "Feature branch moved during exact-tree acceptance ($FEATURE_START -> $FEATURE_NOW); refusing stale publication."
            exit 1
          fi
          git merge-base --is-ancestor "$FEATURE_NOW" HEAD
          git push origin HEAD:"$FEATURE_BRANCH"

      - name: Merge PR 21 with exact head guard
        shell: bash
        run: |
          set -euo pipefail
          head="$(gh pr view 21 --repo "$GITHUB_REPOSITORY" --json headRefOid --jq '.headRefOid')"
          test "$head" = "$FINAL_SHA"
          gh pr merge 21 --repo "$GITHUB_REPOSITORY" --merge --match-head-commit "$FINAL_SHA"
          MERGED_SHA="$(gh pr view 21 --repo "$GITHUB_REPOSITORY" --json mergeCommit --jq '.mergeCommit.oid')"
          test -n "$MERGED_SHA"
          echo "MERGED_SHA=$MERGED_SHA" >> "$GITHUB_ENV"

      - name: Checkout merged source and build production release
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$BASE_BRANCH" --tags
          git checkout --detach "$MERGED_SHA"
          test "$(git rev-parse HEAD)" = "$MERGED_SHA"
          test "$(git show -s --format=%T HEAD)" = "$FINAL_TREE"
          test ! -e .integration
          test ! -e diagnostics
          test ! -e .pc-v016
          test ! -e .release
          test ! -e .release-final
          test ! -e .github/workflows/v016-final-publish.yml

          npm ci
          npm run build
          npm run package
          mkdir -p artifacts

          mapfile -t candidate_zips < <(find release dist build -type f -name '*.zip' 2>/dev/null | sort || true)
          EXT_ZIP=''
          for zipfile in "${candidate_zips[@]}"; do
            if unzip -Z1 "$zipfile" | grep -qx 'manifest.json'; then
              version="$(unzip -p "$zipfile" manifest.json | node -e "let s='';process.stdin.on('data',d=>s+=d);process.stdin.on('end',()=>console.log(JSON.parse(s).version))")"
              if [ "$version" = '0.16.0' ]; then EXT_ZIP="$zipfile"; break; fi
            fi
          done
          if [ -z "$EXT_ZIP" ]; then
            (cd extension && zip -qr ../artifacts/Project-Constellation-v0.16.0-extension.zip .)
          else
            cp "$EXT_ZIP" artifacts/Project-Constellation-v0.16.0-extension.zip
          fi

          unzip -p artifacts/Project-Constellation-v0.16.0-extension.zip manifest.json > /tmp/release-manifest.json
          test "$(node -e "const j=require('/tmp/release-manifest.json');process.stdout.write(j.version)")" = '0.16.0'
          test "$(node -e "const j=require('/tmp/release-manifest.json');process.stdout.write(j.background.service_worker)")" = 'background-entry.js'
          unzip -Z1 artifacts/Project-Constellation-v0.16.0-extension.zip | grep -qx 'src/tab-supervisor-core.js'
          unzip -Z1 artifacts/Project-Constellation-v0.16.0-extension.zip | grep -qx 'src/tab-supervisor-background.js'
          unzip -Z1 artifacts/Project-Constellation-v0.16.0-extension.zip | grep -qx 'src/approval-supervisor-background.js'
          unzip -Z1 artifacts/Project-Constellation-v0.16.0-extension.zip | grep -qx 'src/tab-supervisor.js'

          git archive --format=zip --output=artifacts/Project-Constellation-v0.16.0-source.zip "$MERGED_SHA"
          cp docs/v0.16.0-release-notes.md artifacts/RELEASE-NOTES.md
          (cd artifacts && sha256sum Project-Constellation-v0.16.0-extension.zip Project-Constellation-v0.16.0-source.zip > SHA256SUMS.txt)
          cat > artifacts/RELEASE-RECEIPT.txt <<EOF
          Project Constellation v0.16.0 — Living Project Rooms + AI Command Center + Reliability Supervisor
          PR: https://github.com/${GITHUB_REPOSITORY}/pull/21
          Reliability integration PR: https://github.com/${GITHUB_REPOSITORY}/pull/26
          Exact accepted feature commit: ${FINAL_SHA}
          Exact accepted Git tree: ${FINAL_TREE}
          Merged release commit: ${MERGED_SHA}
          Final publish workflow run: ${GITHUB_RUN_ID}
          npm run verify: PASS on exact accepted tree
          project scale gate: PASS on exact accepted tree
          browser-wide reliability smoke: PASS on exact accepted tree
          Chromium acceptance: PASS on exact accepted tree — real Playwright Chromium + real unpacked extension + ChatGPT-origin fixture inside Chromium
          Chromium scope: installed-extension runtime acceptance; not a signed-in user's local Chrome/provider session
          Temporary diagnostic/recovery workflows in merged release tree: none
          EOF
          cat artifacts/SHA256SUMS.txt >> artifacts/RELEASE-RECEIPT.txt
          sha256sum artifacts/RELEASE-RECEIPT.txt >> artifacts/SHA256SUMS.txt
          cat artifacts/SHA256SUMS.txt

      - name: Publish stable branch, tag, GitHub release
        shell: bash
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --heads origin release/v0.16.0 >/tmp/release-branch.txt 2>/dev/null; then
            existing="$(cut -f1 /tmp/release-branch.txt)"
            test "$existing" = "$MERGED_SHA"
          else
            git push origin "$MERGED_SHA":refs/heads/release/v0.16.0
          fi

          git fetch origin --tags
          if git rev-parse -q --verify refs/tags/$TAG >/dev/null; then
            TAG_SHA="$(git rev-list -n1 "$TAG")"
            test "$TAG_SHA" = "$MERGED_SHA"
          fi

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" \
              artifacts/Project-Constellation-v0.16.0-extension.zip \
              artifacts/Project-Constellation-v0.16.0-source.zip \
              artifacts/SHA256SUMS.txt \
              artifacts/RELEASE-RECEIPT.txt \
              --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" \
              artifacts/Project-Constellation-v0.16.0-extension.zip \
              artifacts/Project-Constellation-v0.16.0-source.zip \
              artifacts/SHA256SUMS.txt \
              artifacts/RELEASE-RECEIPT.txt \
              --repo "$GITHUB_REPOSITORY" \
              --target "$MERGED_SHA" \
              --title 'Project Constellation v0.16.0 — Living Project Rooms + AI Command Center + Reliability Supervisor' \
              --notes-file artifacts/RELEASE-NOTES.md
          fi
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json url,tagName,targetCommitish,isDraft,isPrerelease > artifacts/GITHUB-RELEASE.json
          cat artifacts/GITHUB-RELEASE.json

      - name: Upload complete release bundle for Drive archival
        uses: actions/upload-artifact@v4
        with:
          name: Project-Constellation-v0.16.0-full-release
          path: artifacts/
          if-no-files-found: error
          retention-days: 90

      - name: Final summary
        shell: bash
        run: |
          {
            echo '# Project Constellation v0.16.0 — released'
            echo
            echo "- exact accepted commit: \`$FINAL_SHA\`"
            echo "- accepted tree: \`$FINAL_TREE\`"
            echo "- merged release commit: \`$MERGED_SHA\`"
            echo '- npm run verify: PASS'
            echo '- scale gate: PASS'
            echo '- browser-wide reliability smoke: PASS'
            echo '- installed Chromium acceptance: PASS'
            echo "- tag: \`$TAG\`"
          } >> "$GITHUB_STEP_SUMMARY"
