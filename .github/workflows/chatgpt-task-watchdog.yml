name: External ChatGPT Task Watchdog (compatibility)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/chatgpt-task-watchdog.yml"

permissions:
  contents: read

jobs:
  compatibility:
    runs-on: ubuntu-latest
    steps:
      - name: Compatibility notice
        run: |
          echo "This legacy watchdog has been superseded by External ChatGPT Scheduler Rescue."
          echo "Authoritative workflow: .github/workflows/external-chatgpt-scheduler-rescue.yml"
          echo "It no longer fails on stale connector-access metadata."
