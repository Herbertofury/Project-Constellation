name: Project Constellation Unified Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, for example v0.20.0
        required: true
        default: v0.20.0
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  VERSION: 0.20.0

jobs:
  verify-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: npm }
      - uses: actions/setup-python@v7
        with: { python-version: '3.12', cache: pip, cache-dependency-path: requirements-dev.txt }
      - run: npm ci
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m playwright install --with-deps chromium
      - run: npm run verify

  windows-release:
    runs-on: windows-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 24 }
      - name: Install and verify desktop
        working-directory: desktop
        shell: pwsh
        run: |
          npm install --no-audit --no-fund
          npm run check
          npm test
          node tests/computer-use-windows-smoke.mjs
          .\scripts\electron-smoke.ps1
          npm run build:win
      - uses: actions/upload-artifact@v7
        with:
          name: windows-release
          path: |
            desktop/dist-electron/*.zip
            desktop/dist-electron/*.exe
          if-no-files-found: error

  publish:
    needs: [verify-linux, windows-release]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: actions/download-artifact@v8
        with:
          name: windows-release
          path: desktop/dist-electron
      - uses: actions/setup-node@v7
        with: { node-version: 24 }
      - name: Build exact extension artifact
        env:
          PROJECT_CONSTELLATION_GOOGLE_CLIENT_ID: ${{ secrets.PROJECT_CONSTELLATION_GOOGLE_CLIENT_ID }}
          PROJECT_CONSTELLATION_GITHUB_CLIENT_ID: ${{ secrets.PROJECT_CONSTELLATION_GITHUB_CLIENT_ID }}
        run: |
          if [ -n "$PROJECT_CONSTELLATION_GOOGLE_CLIENT_ID" ] && [ -n "$PROJECT_CONSTELLATION_GITHUB_CLIENT_ID" ]; then npm run build; else node tools/build.mjs --mode=production --allow-unprovisioned-oauth; fi
          node tools/package-unified-release.mjs
      - name: Publish immutable GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          test "$TAG" = "v${VERSION}"
          if gh release view "$TAG" >/dev/null 2>&1; then echo "Release $TAG already exists; refusing to mutate immutable published bytes." >&2; exit 1; fi
          gh release create "$TAG" releases/v${VERSION}/* --verify-tag --title "Project Constellation $TAG" --notes-file "docs/v${VERSION}-release-notes.md"
