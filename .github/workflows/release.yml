name: Production release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing vX.Y.Z tag to publish
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PROJECT_CONSTELLATION_GOOGLE_CLIENT_ID: ${{ secrets.PROJECT_CONSTELLATION_GOOGLE_CLIENT_ID }}
      PROJECT_CONSTELLATION_GITHUB_CLIENT_ID: ${{ secrets.PROJECT_CONSTELLATION_GITHUB_CLIENT_ID }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m venv .venv
      - run: .venv/bin/python -m pip install -r requirements-dev.txt
      - run: .venv/bin/python -m playwright install --with-deps chromium
      - run: npm run verify
      - run: npm run build
      - run: npm run package
      - name: Confirm tag/version agreement
        shell: bash
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          VERSION="v$(node -p "require('./package.json').version")"
          test "$TAG" = "$VERSION"
      - name: Publish or update GitHub Release
        shell: bash
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          VERSION="${TAG#v}"
          FILES=(releases/"$TAG"/Project-Constellation-v"$VERSION"-unpacked.zip releases/"$TAG"/Project-Constellation-v"$VERSION"-source.zip releases/"$TAG"/SHA256SUMS.txt releases/"$TAG"/RELEASE-RECEIPT.json)
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "Project Constellation $TAG — Nightfall" --notes-file docs/v0.14.0-release-notes.md
            gh release upload "$TAG" "${FILES[@]}" --clobber
          else
            gh release create "$TAG" "${FILES[@]}" --verify-tag --title "Project Constellation $TAG — Nightfall" --notes-file docs/v0.14.0-release-notes.md
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: Project-Constellation-release
          path: releases/v*/
