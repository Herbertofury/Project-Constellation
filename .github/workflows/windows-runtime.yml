name: Project Constellation Windows Runtime Gate

on:
  workflow_call:
  workflow_dispatch:
  pull_request:
    paths:
      - 'desktop/**'
      - 'extension/**'
      - 'computer-link/**'
      - 'tests/**'
      - 'tools/**'
      - 'package.json'
      - 'releases/v0.20.1/0.20.0-to-0.20.1.patch'
      - 'releases/v0.20.1/SOURCE-MANIFEST.json'
      - '.github/workflows/windows-runtime.yml'
  push:
    branches: ['release/**', 'upgrade/**']
    paths:
      - 'desktop/**'
      - 'extension/**'
      - 'computer-link/**'
      - 'tools/computer-link/**'
      - 'native/**'
      - 'tests/**'
      - 'package.json'
      - 'releases/v0.20.1/0.20.0-to-0.20.1.patch'
      - 'releases/v0.20.1/SOURCE-MANIFEST.json'
      - '.github/workflows/windows-runtime.yml'

permissions:
  contents: read

jobs:
  windows-native:
    runs-on: windows-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v7

      - name: Reconstruct exact 0.20.1 source lineage
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          if (Test-Path 'native/constellation-monitor/Cargo.toml') {
            "PC_SOURCE_ROOT=$env:GITHUB_WORKSPACE" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            "PC_SOURCE_COMMIT=$env:GITHUB_SHA" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            "PC_SOURCE_TREE=$(git rev-parse 'HEAD^{tree}')" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            $version = (Get-Content 'package.json' -Raw | ConvertFrom-Json).version
            "PC_SOURCE_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            Write-Host "Testing current canonical root source $env:GITHUB_SHA"
            exit 0
          }
          $manifest = Get-Content 'releases/v0.20.1/SOURCE-MANIFEST.json' -Raw | ConvertFrom-Json
          if ($manifest.version -ne '0.20.1') { throw "Unexpected source manifest version: $($manifest.version)" }
          $baseline = [string]$manifest.baseline.artifact
          $delta = [string]$manifest.delta.artifact
          if (-not (Test-Path $baseline)) { throw "Baseline source archive missing: $baseline" }
          if (-not (Test-Path $delta)) { throw "0.20.1 source delta missing: $delta" }
          $baselineHash = (Get-FileHash $baseline -Algorithm SHA256).Hash.ToLowerInvariant()
          $deltaHash = (Get-FileHash $delta -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($baselineHash -ne [string]$manifest.baseline.sha256) { throw "Baseline SHA mismatch: $baselineHash" }
          if ($deltaHash -ne [string]$manifest.delta.sha256) { throw "Delta SHA mismatch: $deltaHash" }

          Expand-Archive $baseline 'pc-source' -Force
          Set-Location 'pc-source'
          git init -q
          git config user.name 'Project Constellation CI'
          git config user.email 'actions@users.noreply.github.com'
          git config core.autocrlf false
          git add -A
          git commit -q -m 'Project Constellation 0.20.0 production baseline'
          git apply --cached "..\$delta"
          git checkout-index -a -f

          $version = node -p "require('./package.json').version" 2>$null
          if ($LASTEXITCODE -ne 0) {
            $version = (Get-Content 'package.json' -Raw | ConvertFrom-Json).version
          }
          if ($version -ne [string]$manifest.version) { throw "Reconstructed package version mismatch: $version" }
          $actualTree = (git write-tree).Trim()
          if ($actualTree -ne [string]$manifest.sourceTree) { throw "Reconstructed source tree mismatch: $actualTree" }
          Set-Location '..'
          $root = (Resolve-Path 'pc-source').Path
          "PC_SOURCE_ROOT=$root" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "PC_SOURCE_COMMIT=$($manifest.sourceCommit)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "PC_SOURCE_TREE=$($manifest.sourceTree)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "PC_SOURCE_VERSION=$($manifest.version)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "reconstructed_source=$root"
          Write-Host "canonical_source_commit=$($manifest.sourceCommit)"

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Build source-bound native Computer Tools for desktop resources
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          Set-Location $env:PC_SOURCE_ROOT
          if (Test-Path 'computer-link/windows-owner/Cargo.toml') {
            rustup toolchain install 1.99.0 --profile minimal
            rustup override set 1.99.0
            node tools/computer-link/build.mjs
            "CONSTELLATION_REQUIRE_NATIVE_TOOLS=1" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          }

      - name: Root regression and contracts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          Set-Location $env:PC_SOURCE_ROOT
          npm ci --no-audit --no-fund
          npm test
          npm run validate
          npm run build:dev

      - name: Install exact desktop dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          Set-Location (Join-Path $env:PC_SOURCE_ROOT 'desktop')
          npm install --no-audit --no-fund
          $actual = (& .\node_modules\.bin\electron.cmd --version | Select-Object -Last 1).ToString().Trim()
          if ($actual -ne 'v44.4.4') { throw "Electron mismatch: $actual" }
          Write-Host "electron_runtime=$actual"

      - name: Desktop full regression and native Windows computer use
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          Set-Location (Join-Path $env:PC_SOURCE_ROOT 'desktop')
          npm run check
          npm test
          node tests/computer-use-windows-smoke.mjs

      - name: Real Electron integrated ChatGPT/local-agent smoke
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          Set-Location (Join-Path $env:PC_SOURCE_ROOT 'desktop')
          .\scripts\electron-smoke.ps1

      - name: Build installer and portable ZIP
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          Set-Location (Join-Path $env:PC_SOURCE_ROOT 'desktop')
          if (Test-Path 'dist-electron') { Remove-Item 'dist-electron' -Recurse -Force }
          npm run build:win

      - name: Fresh portable launch and hash receipt
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $desktop = Join-Path $env:PC_SOURCE_ROOT 'desktop'
          Set-Location $desktop
          $artifact = "Project-Constellation-Desktop-$($env:PC_SOURCE_VERSION)-x64"
          $zip = Get-Item "dist-electron/$artifact.zip"
          $setup = Get-Item "dist-electron/$artifact.exe"
          if (-not $zip) { throw 'Portable ZIP not produced.' }
          if (-not $setup) { throw 'Windows setup not produced.' }

          $fresh = Join-Path $env:RUNNER_TEMP 'pc-portable-fresh'
          if (Test-Path $fresh) { Remove-Item $fresh -Recurse -Force }
          Expand-Archive $zip.FullName $fresh -Force
          $exe = Get-ChildItem $fresh -Filter 'Project Constellation.exe' -Recurse | Select-Object -First 1
          if (-not $exe) { throw 'Project Constellation.exe missing from portable build.' }
          if ($env:CONSTELLATION_REQUIRE_NATIVE_TOOLS -eq '1') {
            node scripts/verify-native-resources.cjs (Join-Path $exe.DirectoryName 'resources/computer-link')
          }
          $output = Join-Path $env:RUNNER_TEMP 'pc-packaged-smoke.json'
          Remove-Item $output -Force -ErrorAction SilentlyContinue
          $env:CONSTELLATION_ELECTRON_SMOKE = '1'
          $env:CONSTELLATION_ELECTRON_SMOKE_OUTPUT = $output
          $proc = Start-Process -FilePath $exe.FullName -PassThru
          $deadline = (Get-Date).AddSeconds(60)
          while (-not (Test-Path $output) -and (Get-Date) -lt $deadline) { Start-Sleep -Milliseconds 250 }
          if (-not (Test-Path $output)) {
            try { Stop-Process -Id $proc.Id -Force } catch {}
            throw 'Packaged portable smoke timed out.'
          }
          $proof = Get-Content $output -Raw | ConvertFrom-Json
          if ($proof.ok -ne $true -or $proof.detail.ok -ne $true -or $proof.detail.pong -ne $true -or $proof.detail.visibleLeak -ne $false) {
            throw "Packaged smoke failed: $(Get-Content $output -Raw)"
          }
          if ($env:CONSTELLATION_REQUIRE_NATIVE_TOOLS -eq '1' -and ($proof.detail.shellRuntime.nativeTools.ok -ne $true -or $proof.detail.shellRuntime.nativeTools.ownerRunning -ne $false)) {
            throw 'Packaged Computer Tools native handshake failed or unexpectedly activated owner access.'
          }
          if ($env:CONSTELLATION_REQUIRE_NATIVE_TOOLS -eq '1') {
            $expectedNative = [System.IO.Path]::GetFullPath((Join-Path $exe.DirectoryName 'resources/computer-link/computer-link-mcp-session.exe'))
            if ($proof.detail.shellRuntime.nativeTools.command -ne $expectedNative) { throw 'Packaged native tool discovery selected a different installation.' }
          }
          if (-not $proc.WaitForExit(10000)) {
            try { Stop-Process -Id $proc.Id -Force } catch {}
            throw 'Packaged portable produced a result but did not confirm graceful application shutdown.'
          }
          if ($proc.ExitCode -ne 0) { throw "Packaged portable exited with code $($proc.ExitCode)." }

          $receipt = [ordered]@{
            schema='project-constellation-windows-runtime-v1'
            product='Project Constellation'
            version=$env:PC_SOURCE_VERSION
            sourceCommit=$env:PC_SOURCE_COMMIT
            platform='windows-latest'
            electron='44.4.4'
            nativeComputerUse='PASS'
            integratedElectron='PASS'
            packagedPortable='PASS'
            gracefulShutdown='PASS'
            nativeComputerTools=if ($env:CONSTELLATION_REQUIRE_NATIVE_TOOLS -eq '1') { 'PASS' } else { 'NOT_APPLICABLE_HISTORICAL_SOURCE' }
            portableFile=$zip.Name
            portableSize=$zip.Length
            portableSha256=(Get-FileHash $zip.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            setupFile=$setup.Name
            setupSize=$setup.Length
            setupSha256=(Get-FileHash $setup.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          }
          $receipt | ConvertTo-Json -Depth 5 | Set-Content 'dist-electron\WINDOWS-RUNTIME-RECEIPT.json' -Encoding utf8

      - name: Stage stable Windows release artifacts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $source = Join-Path $env:PC_SOURCE_ROOT 'desktop\dist-electron'
          New-Item -ItemType Directory -Force 'windows-dist' | Out-Null
          $artifact = "Project-Constellation-Desktop-$($env:PC_SOURCE_VERSION)-x64"
          Copy-Item (Join-Path $source "$artifact.zip") 'windows-dist' -Force
          Copy-Item (Join-Path $source "$artifact.exe") 'windows-dist' -Force
          Copy-Item (Join-Path $source 'WINDOWS-RUNTIME-RECEIPT.json') 'windows-dist' -Force
          Get-ChildItem 'windows-dist' | Select-Object Name,Length | Format-Table

      - uses: actions/upload-artifact@v7
        with:
          name: Project-Constellation-Windows
          path: windows-dist/*
          if-no-files-found: error
          retention-days: 30
