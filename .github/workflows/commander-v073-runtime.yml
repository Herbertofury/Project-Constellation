name: Commander 0.7.3 native runtime
on:
  push:
    branches: [fix/commander-v073-live-bridge]
    paths: [.github/workflows/commander-v073-runtime.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Fetch official Electron 44.4.4 Linux runtime and verify digest
        shell: bash
        run: |
          set -euo pipefail
          mkdir runtime
          cd runtime
          base=https://github.com/electron/electron/releases/download/v44.4.4
          curl --fail --location --retry 2 "$base/SHASUMS256.txt" -o SHASUMS256.txt
          curl --fail --location --retry 2 "$base/electron-v44.4.4-linux-x64.zip" -o electron-v44.4.4-linux-x64.zip
          python3 - <<'PY'
          import hashlib,pathlib
          name='electron-v44.4.4-linux-x64.zip'
          rows=[line.split() for line in pathlib.Path('SHASUMS256.txt').read_text().splitlines()]
          matches=[row[0] for row in rows if len(row)==2 and row[1].lstrip('*')==name]
          assert len(matches)==1, 'Expected one official checksum for '+name
          actual=hashlib.file_digest(open(name,'rb'),'sha256').hexdigest()
          assert actual==matches[0], (actual,matches[0])
          print(name+': verified '+actual)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: Commander-native-electron-44.4.4
          path: runtime/*
          retention-days: 7
          if-no-files-found: error
