name: Apply v0.14.3 stable live state hotfix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-v0143-hotfix.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: hotfix/v0.14.3-state-arbiter
      - name: Reconstruct and apply reviewed patch
        shell: bash
        run: |
          set -euo pipefail
          echo '1e52f76061b01e89a577476c5ec5e214f6ef459bfa27dfd0c7706350464e6d2f  .github/hotfix/v0143.p00.00' | sha256sum -c -
          echo '59a48ea63df4dc435befc93ee6728a3adf42d8e9a12a88cecacd5490bfe93ecb  .github/hotfix/v0143.p00.01' | sha256sum -c -
          echo 'a1c52ecbcd7f485c8bc7411d5f9dc5d91e543060b8483853e4254ac227d8bc5d  .github/hotfix/v0143.p00.02' | sha256sum -c -
          echo 'fed44553bffe50f2f73b550eb7cc7cea04eeb79189efddd33787d425c472d453  .github/hotfix/v0143.p00.03' | sha256sum -c -
          echo 'c29af4b51a723066a5079e94516b55a72206183d546f3678e47f94c0fe08a11c  .github/hotfix/v0143.p00.04' | sha256sum -c -
          echo '7e92db6ab139eb827eb1b9cf5fb1915795a8a59501f08d8995b238798930bd78  .github/hotfix/v0143.patch.xz.b64.01' | sha256sum -c -
          echo '76e11c18f48501d6bc97585f5f984956308e4541e3e10528d081dcf44f00412d  .github/hotfix/v0143.patch.xz.b64.02' | sha256sum -c -
          echo '44272941a7ccbc8b7ab32f7416c1d6d02bb169a8fe344a3056da03936c476117  .github/hotfix/v0143.patch.xz.b64.03' | sha256sum -c -
          { cat .github/hotfix/v0143.p00.*; cat .github/hotfix/v0143.patch.xz.b64.01 .github/hotfix/v0143.patch.xz.b64.02 .github/hotfix/v0143.patch.xz.b64.03; } | base64 -d | xz -d > /tmp/v0143.patch
          echo '38a1436788dd9712d6d22dddb740bd6b8abccf17e6f4591e7179c69345c9e401  /tmp/v0143.patch' | sha256sum -c -
          git apply --check /tmp/v0143.patch
          git apply /tmp/v0143.patch
          rm -rf .github/hotfix
          git config user.name 'Project Constellation Hotfix'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git status --short
          git commit -m 'v0.14.3: stabilize live chat state arbitration'
          git push origin HEAD:hotfix/v0.14.3-state-arbiter
