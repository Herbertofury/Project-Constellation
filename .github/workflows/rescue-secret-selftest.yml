name: Rescue Secret Self-Test

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/rescue-secret-selftest.yml"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Attempt repository secret write with GITHUB_TOKEN
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          printf '%s' 'ok' | gh secret set CHATGPT_RESCUE_SELFTEST --repo "${{ github.repository }}"
          echo "SECRET_WRITE_SUCCEEDED"
