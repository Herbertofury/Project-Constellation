name: External ChatGPT Scheduler Rescue

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "watchdog/external_scheduler_rescue.py"
      - "watchdog/external_scheduler_recovery.mjs"
      - ".github/workflows/external-chatgpt-scheduler-rescue.yml"
      - "watchdog/recovery-controller.json"

permissions:
  actions: write
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: external-chatgpt-scheduler-rescue
  cancel-in-progress: false

jobs:
  rescue:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CHATGPT_STALE_MINUTES: "75"
    steps:
      - uses: actions/checkout@v7
        with:
          # Operational incidents describe the current default-branch audit,
          # including when an old run is rerun or another ref is dispatched.
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-node@v7
        with: { node-version: '26.13.1' }
      - uses: actions/setup-python@v7
        with: { python-version: '3.12' }

      - name: Verify recovery decisions before external actions
        run: |
          node --test tests/external-scheduler-recovery.test.mjs
          python -m unittest discover -s tests -p test_external_scheduler_rescue.py -v

      - name: Evaluate committed scheduler audit
        run: python watchdog/external_scheduler_rescue.py --out logs/external-recovery/health.json

      - name: Persist incident and supervise independent recovery channels
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('node:fs');
            const { pathToFileURL } = require('node:url');
            const path = require('node:path');
            const { superviseRecovery, recoverySummary } = await import(pathToFileURL(path.resolve('watchdog/external_scheduler_recovery.mjs')).href);
            const health = JSON.parse(fs.readFileSync('logs/external-recovery/health.json', 'utf8'));
            const report = await superviseRecovery({ github, context, health });
            fs.writeFileSync('logs/external-recovery/result.json', JSON.stringify(report, null, 2) + '\n');
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, recoverySummary(health, report));
            if (report.outcome === 'blocked') core.warning('Recovery incident is preserved; the PR or diagnostic channel is blocked by repository policy or token permissions. See the recorded status.');
            if (report.outcome === 'failed') core.setFailed('Recovery supervision encountered an unexpected failure. See the retained result and incident.');

      - name: Preserve actual audit and recovery outcome
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: external-scheduler-recovery-${{ github.run_id }}-${{ github.run_attempt }}
          path: logs/external-recovery/*.json
          if-no-files-found: warn
          retention-days: 30
