name: PR21 live browser diagnostic

on:
  push:
    branches:
      - feature/chat-vault-pulse-rename-decorations
    paths:
      - '.integration/live-browser-diagnostic-trigger.txt'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Recreate accepted v0.16 integration tree
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin feat/v0.16.0-living-project-rooms-safe-router
          git merge --no-commit --no-ff origin/feat/v0.16.0-living-project-rooms-safe-router || true
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('package.json'); data=json.loads(p.read_text()); data['version']='0.16.0'; p.write_text(json.dumps(data,indent=2)+'\n')
          m=Path('extension/manifest.json'); md=json.loads(m.read_text()); md['version']='0.16.0'; md['background']={'service_worker':'background-entry.js','type':'module'}; m.write_text(json.dumps(md,indent=2)+'\n')
          PY
          git add package.json extension/manifest.json
          conflicts="$(git diff --name-only --diff-filter=U)"
          if [ -n "$conflicts" ]; then echo "$conflicts"; exit 1; fi
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m venv .venv
      - run: .venv/bin/python -m pip install -r requirements-dev.txt
      - run: .venv/bin/python -m playwright install --with-deps chromium
      - name: Capture real Chromium acceptance diagnostics
        shell: bash
        run: |
          set +e
          xvfb-run -a .venv/bin/python -u tools/live_browser_acceptance.py > live-browser.log 2>&1
          code=$?
          echo "exit_code=$code" | tee live-browser-result.txt
          cat live-browser.log
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: live-browser-diagnostic
          path: |
            live-browser.log
            live-browser-result.txt
          if-no-files-found: error
