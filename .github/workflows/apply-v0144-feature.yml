name: Apply v0.14.4 Deep State + Tab Beacons

on:
  push:
    branches: [feature/v0.14.4-deep-state-tab-beacons]
    paths:
      - '.github/workflows/apply-v0144-feature.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: feature/v0.14.4-deep-state-tab-beacons
      - name: Verify and apply reviewed v0.14.4 patch
        shell: bash
        run: |
          set -euo pipefail
          echo 'f47da45a4ac03dd3549179b438c11f55095c9efb278ce29377dc4a3ae2c256c2  .github/hotfix/v0144.patch.xz.b64.00' | sha256sum -c -
          echo '6300ac9b8caada486e57c3fb1cbda768d1a0bddc62efb4beeee0d3542070352c  .github/hotfix/v0144.patch.xz.b64.01' | sha256sum -c -
          echo 'a6793bed27e1242b400b83c30f25ba43088931daf5ffe31d367a3833b997e36a  .github/hotfix/v0144.patch.xz.b64.02' | sha256sum -c -
          echo '9bf11c7817c72425684db7c290bcc66c2dabaf252959745ddf41e42a6fc01cc0  .github/hotfix/v0144.patch.xz.b64.03' | sha256sum -c -
          echo 'a547bda4bffba6cd7f469261e2ad85044207b96ecd5dd135d3c6480500014279  .github/hotfix/v0144.patch.xz.b64.04' | sha256sum -c -
          cat .github/hotfix/v0144.patch.xz.b64.* | base64 -d | xz -d > /tmp/v0144.patch
          echo '9cfec8c4e93579e4590b58323555d697dc8fb674053a355cdbd290b88f0e6f8e  /tmp/v0144.patch' | sha256sum -c -
          git apply --check /tmp/v0144.patch
          git apply /tmp/v0144.patch
          rm -rf .github/hotfix .github/workflows/apply-v0144-feature.yml
          git config user.name 'Project Constellation Hotfix'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git status --short
          git commit -m 'v0.14.4: deep ChatGPT state and tab beacons'
          git push origin HEAD:feature/v0.14.4-deep-state-tab-beacons
