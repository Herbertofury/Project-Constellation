name: v0.16 materialize exact source

on:
  push:
    branches:
      - feat/v0.16.0-living-project-rooms-safe-router
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Recover, verify, and apply exact v0.16 source delta
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_B64='bec45b735d5000abbc6e946602027c696c603a6ab650a32448c53a9657b5fde3'
          EXPECTED_GZ='9c4b6d435badc0e12f11a3099a60af7000ea9b4112c420d421dea66c8e02f55e'
          EXPECTED_PATCH='d7f8dba02e49bc9bedf3e8299c94c842e0d03ee053a7dfb290be94cac935d0bd'
          rm -rf /tmp/v016-candidates
          mkdir -p /tmp/v016-candidates

          cp .pc-v016/payload.b64 /tmp/v016-candidates/current-payload 2>/dev/null || true
          cat .pc-v016/chunks/part-* > /tmp/v016-candidates/current-chunks 2>/dev/null || true
          tr -d '\r\n\t ' < /tmp/v016-candidates/current-payload > /tmp/v016-candidates/current-payload-compact 2>/dev/null || true
          tr -d '\r\n\t ' < /tmp/v016-candidates/current-chunks > /tmp/v016-candidates/current-chunks-compact 2>/dev/null || true

          echo 'Payload history:'
          git log --all --format='%H %s' -- .pc-v016/payload.b64 || true
          i=0
          while read -r commit; do
            [ -n "$commit" ] || continue
            if git show "$commit:.pc-v016/payload.b64" > "/tmp/v016-candidates/history-$i" 2>/dev/null; then
              tr -d '\r\n\t ' < "/tmp/v016-candidates/history-$i" > "/tmp/v016-candidates/history-$i-compact"
              i=$((i + 1))
            fi
          done < <(git log --all --format='%H' -- .pc-v016/payload.b64)

          FOUND=''
          for candidate in /tmp/v016-candidates/*; do
            [ -s "$candidate" ] || continue
            B64_HASH="$(sha256sum "$candidate" | awk '{print $1}')"
            SIZE="$(wc -c < "$candidate" | tr -d ' ')"
            printf 'candidate=%s size=%s b64=%s%s\n' "$(basename "$candidate")" "$SIZE" "$B64_HASH" "$([ "$B64_HASH" = "$EXPECTED_B64" ] && printf ' OUTER_MATCH' || true)"
            if ! base64 -d "$candidate" > /tmp/v016-candidate.gz 2>/dev/null; then
              continue
            fi
            GZ_HASH="$(sha256sum /tmp/v016-candidate.gz | awk '{print $1}')"
            printf '  decoded-gz=%s%s\n' "$GZ_HASH" "$([ "$GZ_HASH" = "$EXPECTED_GZ" ] && printf ' INNER_GZ_MATCH' || true)"
            [ "$GZ_HASH" = "$EXPECTED_GZ" ] || continue
            if ! gzip -dc /tmp/v016-candidate.gz > /tmp/v016-candidate.patch 2>/dev/null; then
              continue
            fi
            PATCH_HASH="$(sha256sum /tmp/v016-candidate.patch | awk '{print $1}')"
            printf '  decoded-patch=%s%s\n' "$PATCH_HASH" "$([ "$PATCH_HASH" = "$EXPECTED_PATCH" ] && printf ' INNER_PATCH_MATCH' || true)"
            if [ "$PATCH_HASH" = "$EXPECTED_PATCH" ]; then
              FOUND="$candidate"
              cp /tmp/v016-candidate.gz /tmp/v016.patch.gz
              cp /tmp/v016-candidate.patch /tmp/v016.patch
              break
            fi
          done

          test -n "$FOUND"
          echo "Verified exact v0.16 patch payload from $(basename "$FOUND")."
          echo "$EXPECTED_GZ  /tmp/v016.patch.gz" | sha256sum -c -
          echo "$EXPECTED_PATCH  /tmp/v016.patch" | sha256sum -c -
          git apply --check /tmp/v016.patch
          git apply /tmp/v016.patch
          git diff --check
          test "$(node -p "require('./package.json').version")" = '0.16.0'
          test "$(node -p "require('./extension/manifest.json').version")" = '0.16.0'
          test -f extension/src/project-router-core.js
          test -f tests/project-scale.test.mjs
          test -f docs/v0.16.0-release-notes.md
      - name: Commit clean source and remove transport
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .pc-v016 .github/workflows/v016-materialize.yml
          git add -A
          git diff --cached --check
          git config user.name 'Project Constellation Materializer'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m 'Build v0.16.0 Living Project Rooms + Safe Router'
          git push origin HEAD:${GITHUB_REF_NAME}
