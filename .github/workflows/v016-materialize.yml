name: v0.16 materialize recovered source

on:
  push:
    branches:
      - feat/v0.16.0-living-project-rooms-safe-router
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Verify recovered v0.16 delta
        shell: bash
        run: |
          set -euo pipefail
          for f in \
            .pc-v016/recovered/part-00a .pc-v016/recovered/part-00b .pc-v016/recovered/part-00c \
            .pc-v016/recovered/part-01a .pc-v016/recovered/part-01b .pc-v016/recovered/part-01c \
            .pc-v016/recovered/part-02a .pc-v016/recovered/part-02b .pc-v016/recovered/part-02c \
            .pc-v016/recovered/part-03a .pc-v016/recovered/part-03b .pc-v016/recovered/part-03c; do
            test "$(wc -c < "$f")" -eq 3000
          done
          test "$(wc -c < .pc-v016/recovered/part-04)" -eq 2096
          echo '7f7a493f436ecff32634bf2f9786cac9fc8b142de249bf05707c38f8cdf8009f  .pc-v016/recovered/part-00a' | sha256sum -c -
          echo 'c3fae1845a44b859f28128a614878ebf4780b86c15afed4f6b5188e017266dc8  .pc-v016/recovered/part-00b' | sha256sum -c -
          echo '02c838ab846e95f09398a49cf7d372ce4ecc75361ca67e6909539cc977bd0288  .pc-v016/recovered/part-00c' | sha256sum -c -
          echo 'be92bce0950489535f6701d8db8bf87fa52602d77b5d1397673518ec182dfe34  .pc-v016/recovered/part-01a' | sha256sum -c -
          echo '2f22ab8beeedddf35889f22a152cac62e8a21e9fb0758c6f2f151460c5f57331  .pc-v016/recovered/part-01b' | sha256sum -c -
          echo 'b02e748f567b05b31ae0e2a695f13129bf2f999e601cda5064cb430ddeb297a5  .pc-v016/recovered/part-01c' | sha256sum -c -
          echo '32a4a3438c577a4530b5c5ad6f78e90f06277a801cf9b147a78232c9ba186a77  .pc-v016/recovered/part-02a' | sha256sum -c -
          echo '712b7d72cf2a176b458c9c48e67e89909ac4e74780e9a58d56fcbb645ce89e72  .pc-v016/recovered/part-02b' | sha256sum -c -
          echo 'f73e7c17ff245191b6f6852726e43b145e9f9bc13486f005083dd489e50bc41c  .pc-v016/recovered/part-02c' | sha256sum -c -
          echo 'ff20da1e7aff0fbe464ac7ac78852b3eef6a91cfce05cffbb5678113340a0670  .pc-v016/recovered/part-03a' | sha256sum -c -
          echo 'cec9e2ad99cef5bc14f64f8b2455267ea762f53afc5dc6b710860a9d82228823  .pc-v016/recovered/part-03b' | sha256sum -c -
          echo '8894a4ee24a2703e934851e31d64cb558f25aa12d81a1a2df31daa04b13166cc  .pc-v016/recovered/part-03c' | sha256sum -c -
          echo '76b8f3b484fab2eba2bc7100a14ec542dd1f7f999cb090aca4f24e25d4de588c  .pc-v016/recovered/part-04' | sha256sum -c -
          cat \
            .pc-v016/recovered/part-00a .pc-v016/recovered/part-00b .pc-v016/recovered/part-00c \
            .pc-v016/recovered/part-01a .pc-v016/recovered/part-01b .pc-v016/recovered/part-01c \
            .pc-v016/recovered/part-02a .pc-v016/recovered/part-02b .pc-v016/recovered/part-02c \
            .pc-v016/recovered/part-03a .pc-v016/recovered/part-03b .pc-v016/recovered/part-03c \
            .pc-v016/recovered/part-04 > /tmp/v016.b64
          echo '53e5b807d45c086560ac3e4ea7df0ea2865aa2e5f394ec04b69b47ccc75a8810  /tmp/v016.b64' | sha256sum -c -
          base64 -d /tmp/v016.b64 > /tmp/v016.patch.gz
          echo '4a0754d54df2a7b9eca69b7311a141c343a438811ba0f09deddf70a4a39acac7  /tmp/v016.patch.gz' | sha256sum -c -
          gzip -dc /tmp/v016.patch.gz > /tmp/v016.patch
          echo 'cf5764c41f4aeb4f8c9f5ea62a54b6b0c9b504d5422bab34982e5ce80def4cc6  /tmp/v016.patch' | sha256sum -c -
          git apply --check /tmp/v016.patch
          git apply /tmp/v016.patch
          git diff --check
          test "$(node -p "require('./package.json').version")" = '0.16.0'
          test "$(node -p "require('./extension/manifest.json').version")" = '0.16.0'
          test -f extension/src/project-router-core.js
          test -f tests/project-scale.test.mjs
          test -f docs/v0.16.0-release-notes.md
      - name: Commit clean recovered source and remove transport
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .pc-v016 .github/workflows/v016-materialize.yml
          git add -A
          git diff --cached --check
          git config user.name 'Project Constellation Materializer'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m 'Build v0.16.0 Living Project Rooms + Safe Router'
          git push origin HEAD:${GITHUB_REF_NAME}
