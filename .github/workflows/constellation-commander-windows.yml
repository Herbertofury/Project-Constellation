name: Constellation Commander v0.6 Integrated Electron Windows Build

on:
  push:
    branches:
      - feature/constellation-commander-v0.6.0
    paths:
      - 'releases/constellation-commander/v0.6.0/ci-source-release/**'
      - '.github/workflows/constellation-commander-windows.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'releases/constellation-commander/v0.6.0/ci-source-release/**'
      - '.github/workflows/constellation-commander-windows.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows-electron:
    runs-on: windows-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4

      - name: Reassemble exact verified v0.6 source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $parts = Get-ChildItem 'releases/constellation-commander/v0.6.0/ci-source-release/part*' | Sort-Object Name
          if ($parts.Count -ne 4) { throw "Expected 4 source parts, found $($parts.Count)" }
          $b64 = ($parts | ForEach-Object { Get-Content -LiteralPath $_.FullName -Raw }) -join ''
          [IO.File]::WriteAllBytes('commander-source.zip', [Convert]::FromBase64String($b64))
          $actual = (Get-FileHash -Algorithm SHA256 'commander-source.zip').Hash.ToLowerInvariant()
          $expected = '78a83fa73ad1498db5338552f8f3c13c4485972c4629227dc67aa5d113a0040b'
          if ($actual -ne $expected) { throw "Source SHA mismatch: $actual" }
          Expand-Archive 'commander-source.zip' 'commander-source' -Force
          git apply --check --directory=commander-source/constellation-commander-v0.6.0 releases/constellation-commander/v0.6.0/electron-smoke-ci-fix.patch
          git apply --directory=commander-source/constellation-commander-v0.6.0 releases/constellation-commander/v0.6.0/electron-smoke-ci-fix.patch
          git apply --check --directory=commander-source/constellation-commander-v0.6.0 releases/constellation-commander/v0.6.0/electron-runtime-ci-fix.patch
          git apply --directory=commander-source/constellation-commander-v0.6.0 releases/constellation-commander/v0.6.0/electron-runtime-ci-fix.patch
          $expectedFiles = @{
            'commander-source/constellation-commander-v0.6.0/electron/main.cjs' = '28b26809c83163116808bbaa7b1075f754d00a38743ed28b98f271f7bf610397'
            'commander-source/constellation-commander-v0.6.0/electron/chat-preload.cjs' = 'c2de0c0516e59c83d3f8dfbfb1c12b440d2862ac4897947516a1436f66729401'
            'commander-source/constellation-commander-v0.6.0/electron/fixture-chat.html' = '5ebb73bee441adbaa3499399f5821d4394ef6a6927851f398bd4e846f6749a38'
            'commander-source/constellation-commander-v0.6.0/scripts/electron-smoke.ps1' = '8ccdd30afcebe78ce9fbf6a1e4bf9efa55c4b2cf3c5553406d6828355636258f'
          }
          foreach ($entry in $expectedFiles.GetEnumerator()) {
            $text = [IO.File]::ReadAllText($entry.Key).Replace("`r`n", "`n").Replace("`r", "`n")
            $bytes = [Text.UTF8Encoding]::new($false).GetBytes($text)
            $fileHash = ([Convert]::ToHexString([Security.Cryptography.SHA256]::HashData($bytes))).ToLowerInvariant()
            if ($fileHash -ne $entry.Value) { throw "Patched source normalized hash mismatch for $($entry.Key): $fileHash" }
          }

      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'

      - name: Install exact Electron dependencies
        shell: pwsh
        working-directory: commander-source/constellation-commander-v0.6.0
        run: |
          $ErrorActionPreference = 'Stop'
          npm install --no-audit --no-fund
          $pkg = Get-Content package.json -Raw | ConvertFrom-Json
          if ($pkg.devDependencies.electron -ne '44.4.3') { throw "Unexpected Electron package version $($pkg.devDependencies.electron)" }
          if ($pkg.devDependencies.'electron-builder' -ne '26.16.1') { throw "Unexpected electron-builder version $($pkg.devDependencies.'electron-builder')" }
          $electronVersion = ((& .\node_modules\.bin\electron.cmd --version 2>&1 | Select-Object -Last 1).ToString()).Trim()
          if ($electronVersion -ne 'v44.4.3') { throw "Installed Electron runtime mismatch: $electronVersion" }
          Write-Host "electron_runtime=$electronVersion"

      - name: Run full regression and Windows native computer-use suite
        shell: pwsh
        working-directory: commander-source/constellation-commander-v0.6.0
        run: |
          npm run check
          npm test

      - name: Prove integrated Electron ChatGPT tool round trip before packaging
        shell: pwsh
        working-directory: commander-source/constellation-commander-v0.6.0
        run: |
          ./scripts/electron-smoke.ps1

      - name: Build one-click NSIS installer and portable ZIP
        shell: pwsh
        working-directory: commander-source/constellation-commander-v0.6.0
        run: |
          npm run build:win
          Get-ChildItem dist-electron | Format-Table Name,Length

      - name: Validate packaged artifacts
        shell: pwsh
        working-directory: commander-source/constellation-commander-v0.6.0
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = Get-ChildItem dist-electron -Filter '*.exe' | Where-Object { $_.Name -notmatch 'uninstall' } | Sort-Object Length -Descending | Select-Object -First 1
          $portable = Get-ChildItem dist-electron -Filter '*.zip' | Sort-Object Length -Descending | Select-Object -First 1
          if (-not $installer) { throw 'NSIS installer was not produced.' }
          if (-not $portable) { throw 'Portable ZIP was not produced.' }
          $installerHash = (Get-FileHash -Algorithm SHA256 $installer.FullName).Hash.ToLowerInvariant()
          $portableHash = (Get-FileHash -Algorithm SHA256 $portable.FullName).Hash.ToLowerInvariant()
          "installer_sha256=$installerHash" | Tee-Object -FilePath dist-electron\SHA256SUMS.txt
          "portable_sha256=$portableHash" | Tee-Object -FilePath dist-electron\SHA256SUMS.txt -Append
          "installer_file=$($installer.Name)" | Tee-Object -FilePath dist-electron\SHA256SUMS.txt -Append
          "portable_file=$($portable.Name)" | Tee-Object -FilePath dist-electron\SHA256SUMS.txt -Append

      - name: Silent-install and prove installed integrated Electron tool loop
        shell: pwsh
        working-directory: commander-source/constellation-commander-v0.6.0
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = Get-ChildItem dist-electron -Filter '*.exe' | Where-Object { $_.Name -notmatch 'uninstall' } | Sort-Object Length -Descending | Select-Object -First 1
          & $installer.FullName /S
          if ($LASTEXITCODE -ne 0) { throw "NSIS install failed with exit code $LASTEXITCODE" }

          $installed = Get-ChildItem (Join-Path $env:LOCALAPPDATA 'Programs') -Filter 'Constellation Commander.exe' -File -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $installed) { throw 'Installed Constellation Commander executable was not found.' }

          $output = Join-Path $env:RUNNER_TEMP 'constellation-electron-installed-smoke.json'
          Remove-Item $output -Force -ErrorAction SilentlyContinue
          $env:CONSTELLATION_ELECTRON_SMOKE = '1'
          $env:CONSTELLATION_ELECTRON_SMOKE_OUTPUT = $output
          $proc = Start-Process -FilePath $installed.FullName -PassThru
          $deadline = (Get-Date).AddSeconds(40)
          while (-not (Test-Path $output) -and (Get-Date) -lt $deadline) { Start-Sleep -Milliseconds 250 }
          if (-not (Test-Path $output)) {
            try { Stop-Process -Id $proc.Id -Force } catch {}
            throw 'Installed Electron tool-loop smoke timed out.'
          }
          $data = Get-Content $output -Raw | ConvertFrom-Json
          if ($data.ok -ne $true -or $data.event -ne 'tool-result-sent' -or $data.detail.ok -ne $true -or $data.detail.pong -ne $true -or $data.detail.visibleLeak -ne $false) {
            throw "Installed Electron tool-loop smoke failed: $(Get-Content $output -Raw)"
          }
          try { if (-not $proc.HasExited) { Stop-Process -Id $proc.Id -Force } } catch {}
          Write-Host 'Windows v0.6 integrated Electron ChatGPT + direct Commander IPC smoke PASS'
          Write-Host "installed_exe=$($installed.FullName)"

      - uses: actions/upload-artifact@v4
        with:
          name: Constellation-Commander-v0.6.0-Windows
          path: |
            commander-source/constellation-commander-v0.6.0/dist-electron/*.exe
            commander-source/constellation-commander-v0.6.0/dist-electron/*.zip
            commander-source/constellation-commander-v0.6.0/dist-electron/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
