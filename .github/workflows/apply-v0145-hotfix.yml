name: Apply v0.14.5 Pulse Navigator

on:
  push:
    branches: [hotfix/v0.14.5-pulse-navigator]
    paths:
      - '.github/workflows/apply-v0145-hotfix.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: hotfix/v0.14.5-pulse-navigator
      - name: Diagnose staged chunks
        shell: bash
        run: |
          set -euo pipefail
          sha256sum .github/hotfix/v0145.small.*
          wc -c .github/hotfix/v0145.small.*
          exit 1
