name: Constellation Commander v0.7 Product Windows Acceptance

on:
  push:
    branches:
      - ci/commander-v070-windows-proof
    paths:
      - 'releases/constellation-commander/v0.7.0/commander-v060-to-v070.patch'
      - 'releases/constellation-commander/v0.7.0/TREE-SHA256.txt'
      - '.github/workflows/constellation-commander-v070-windows.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'releases/constellation-commander/v0.7.0/**'
      - '.github/workflows/constellation-commander-v070-windows.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows-product:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Verify and unpack exact canonical v0.7 source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $source = 'releases/constellation-commander/v0.7.0/Constellation-Commander-v0.7.0-source.zip'
          if (-not (Test-Path $source)) { throw "Missing canonical v0.7 source archive: $source" }
          $sourceHash = (Get-FileHash -Algorithm SHA256 $source).Hash.ToLowerInvariant()
          if ($sourceHash -ne '43266bac1a43732bb41a52c819cd9f2d10e3ab60d0cd70dcb61d34989eed0dd0') { throw "v0.7 source SHA mismatch: $sourceHash" }
          Expand-Archive $source 'commander-source' -Force
          $root = (Resolve-Path 'commander-source/constellation-commander-v0.7.0').Path

          $manifestPath = 'releases/constellation-commander/v0.7.0/TREE-SHA256.txt'
          $manifestText = [IO.File]::ReadAllText($manifestPath).Replace("`r`n", "`n").Replace("`r", "`n")
          $manifestBytes = [Text.UTF8Encoding]::new($false).GetBytes($manifestText)
          $manifestHash = ([Convert]::ToHexString([Security.Cryptography.SHA256]::HashData($manifestBytes))).ToLowerInvariant()
          if ($manifestHash -ne '89ccb6612f1ad47d65c6ee1523c7b0668b1a75d14b84c88e434addd56753413c') { throw "v0.7 tree manifest SHA mismatch: $manifestHash" }

          $expected = @{}
          foreach ($line in Get-Content $manifestPath) {
            if ($line -notmatch '^([0-9a-f]{64})\s+(\d+)\s+(.+)$') { throw "Malformed tree-manifest line: $line" }
            $expected[$Matches[3]] = @{ hash = $Matches[1]; size = [int64]$Matches[2] }
          }
          $actualFiles = Get-ChildItem $root -File -Recurse
          if ($actualFiles.Count -ne $expected.Count) { throw "v0.7 file-count mismatch: actual=$($actualFiles.Count) expected=$($expected.Count)" }
          foreach ($file in $actualFiles) {
            $rel = [IO.Path]::GetRelativePath($root, $file.FullName).Replace('\','/')
            if (-not $expected.ContainsKey($rel)) { throw "Unexpected v0.7 source file: $rel" }
            if ($file.Length -ne $expected[$rel].size) { throw "Size mismatch for ${rel}: $($file.Length)" }
            $hash = (Get-FileHash -Algorithm SHA256 $file.FullName).Hash.ToLowerInvariant()
            if ($hash -ne $expected[$rel].hash) { throw "SHA mismatch for ${rel}: $hash" }
          }
          Write-Host "source_sha256=$sourceHash"
          Write-Host "v070_files=$($expected.Count)"

      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'

      - name: Install exact production dependencies
        shell: pwsh
        working-directory: commander-source/constellation-commander-v0.7.0
        run: |
          $ErrorActionPreference = 'Stop'
          npm install --no-audit --no-fund
          $pkg = Get-Content package.json -Raw | ConvertFrom-Json
          if ($pkg.version -ne '0.7.0') { throw "Unexpected Commander version $($pkg.version)" }
          if ($pkg.devDependencies.electron -ne '44.4.3') { throw "Unexpected Electron package version $($pkg.devDependencies.electron)" }
          if ($pkg.devDependencies.'electron-builder' -ne '26.16.1') { throw "Unexpected electron-builder version $($pkg.devDependencies.'electron-builder')" }
          if ($pkg.build.asar -ne $true) { throw 'ASAR packaging must be enabled.' }
          if (@($pkg.build.asarUnpack) -notcontains 'native/**/*') { throw 'native/**/* must be unpacked from ASAR.' }
          $electronVersion = ((& .\node_modules\.bin\electron.cmd --version 2>&1 | Select-Object -Last 1).ToString()).Trim()
          if ($electronVersion -ne 'v44.4.3') { throw "Installed Electron runtime mismatch: $electronVersion" }
          Write-Host "electron_runtime=$electronVersion"

      - name: Run full regression and Windows native computer-use suite
        shell: pwsh
        working-directory: commander-source/constellation-commander-v0.7.0
        run: |
          npm run check
          npm test

      - name: Prove visible shell plus integrated ChatGPT tool loop
        shell: pwsh
        working-directory: commander-source/constellation-commander-v0.7.0
        run: |
          ./scripts/electron-smoke.ps1

      - name: Build ASAR-backed NSIS installer and portable ZIP
        shell: pwsh
        working-directory: commander-source/constellation-commander-v0.7.0
        run: |
          npm run build:win
          Get-ChildItem dist-electron | Format-Table Name,Length

      - name: Validate package layout and artifact hashes
        shell: pwsh
        working-directory: commander-source/constellation-commander-v0.7.0
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = Get-ChildItem dist-electron -Filter '*.exe' | Where-Object { $_.Name -notmatch 'uninstall' } | Sort-Object Length -Descending | Select-Object -First 1
          $portable = Get-ChildItem dist-electron -Filter '*.zip' | Sort-Object Length -Descending | Select-Object -First 1
          if (-not $installer) { throw 'NSIS installer was not produced.' }
          if (-not $portable) { throw 'Portable ZIP was not produced.' }

          Remove-Item portable-check -Recurse -Force -ErrorAction SilentlyContinue
          Expand-Archive $portable.FullName portable-check -Force
          $asar = Get-ChildItem portable-check -Filter 'app.asar' -File -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          $native = Get-ChildItem portable-check -Filter 'windows-computer-use.ps1' -File -Recurse -ErrorAction SilentlyContinue | Where-Object { $_.FullName -match 'app\.asar\.unpacked' } | Select-Object -First 1
          if (-not $asar) { throw 'Packaged portable app.asar was not found.' }
          if (-not $native) { throw 'Unpacked Windows native helper was not found beside app.asar.' }

          $installerHash = (Get-FileHash -Algorithm SHA256 $installer.FullName).Hash.ToLowerInvariant()
          $portableHash = (Get-FileHash -Algorithm SHA256 $portable.FullName).Hash.ToLowerInvariant()
          "installer_sha256=$installerHash" | Tee-Object -FilePath dist-electron\SHA256SUMS.txt
          "portable_sha256=$portableHash" | Tee-Object -FilePath dist-electron\SHA256SUMS.txt -Append
          "installer_file=$($installer.Name)" | Tee-Object -FilePath dist-electron\SHA256SUMS.txt -Append
          "portable_file=$($portable.Name)" | Tee-Object -FilePath dist-electron\SHA256SUMS.txt -Append
          "source_sha256=43266bac1a43732bb41a52c819cd9f2d10e3ab60d0cd70dcb61d34989eed0dd0" | Tee-Object -FilePath dist-electron\SHA256SUMS.txt -Append
          "tree_manifest_sha256=89ccb6612f1ad47d65c6ee1523c7b0668b1a75d14b84c88e434addd56753413c" | Tee-Object -FilePath dist-electron\SHA256SUMS.txt -Append
          Write-Host "asar=$($asar.FullName)"
          Write-Host "native_unpacked=$($native.FullName)"

      - name: Silent-install and prove installed shell plus ChatGPT IPC loop
        shell: pwsh
        working-directory: commander-source/constellation-commander-v0.7.0
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = Get-ChildItem dist-electron -Filter '*.exe' | Where-Object { $_.Name -notmatch 'uninstall' } | Sort-Object Length -Descending | Select-Object -First 1
          $installProc = Start-Process -FilePath $installer.FullName -ArgumentList '/S' -PassThru -Wait
          if ($installProc.ExitCode -ne 0) { throw "NSIS install failed with exit code $($installProc.ExitCode)" }

          $installed = Get-ChildItem (Join-Path $env:LOCALAPPDATA 'Programs') -Filter 'Constellation Commander.exe' -File -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $installed) { throw 'Installed Constellation Commander executable was not found.' }

          $output = Join-Path $env:RUNNER_TEMP 'constellation-electron-installed-smoke.json'
          $stdout = Join-Path $env:RUNNER_TEMP 'constellation-electron-installed.stdout.log'
          $stderr = Join-Path $env:RUNNER_TEMP 'constellation-electron-installed.stderr.log'
          $trace = "$output.trace.log"
          Remove-Item $output,$stdout,$stderr,$trace -Force -ErrorAction SilentlyContinue
          $env:CONSTELLATION_ELECTRON_SMOKE = '1'
          $env:CONSTELLATION_ELECTRON_SMOKE_OUTPUT = $output
          $env:ELECTRON_ENABLE_LOGGING = '1'
          $proc = Start-Process -FilePath $installed.FullName -RedirectStandardOutput $stdout -RedirectStandardError $stderr -PassThru
          $deadline = (Get-Date).AddSeconds(55)
          while (-not (Test-Path $output) -and (Get-Date) -lt $deadline) { Start-Sleep -Milliseconds 200 }
          if (-not (Test-Path $output)) {
            try { Stop-Process -Id $proc.Id -Force } catch {}
            $t = if (Test-Path $trace) { Get-Content $trace -Raw } else { '' }
            $o = if (Test-Path $stdout) { Get-Content $stdout -Raw } else { '' }
            $e = if (Test-Path $stderr) { Get-Content $stderr -Raw } else { '' }
            throw "Installed v0.7 product smoke timed out.`nTRACE:`n$t`nSTDOUT:`n$o`nSTDERR:`n$e"
          }
          $data = Get-Content $output -Raw | ConvertFrom-Json
          if ($data.ok -ne $true -or $data.event -ne 'tool-result-sent' -or $data.detail.ok -ne $true -or $data.detail.pong -ne $true -or $data.detail.visibleLeak -ne $false -or $data.detail.shellRuntime.ok -ne $true -or $data.detail.shellRuntime.version -ne '0.7.0' -or $data.detail.shellRuntime.toolCount -lt 45 -or $data.detail.shellRuntime.health.ok -ne $true -or $data.detail.shellRuntime.singleInstanceOwner -ne $true) {
            $t = if (Test-Path $trace) { Get-Content $trace -Raw } else { '' }
            throw "Installed v0.7 product smoke failed: $(Get-Content $output -Raw)`nTRACE:`n$t"
          }
          try { if (-not $proc.HasExited) { Stop-Process -Id $proc.Id -Force } } catch {}
          Write-Host 'Constellation Commander v0.7 installed visible shell + integrated ChatGPT IPC: PASS'
          Write-Host "installed_exe=$($installed.FullName)"

      - uses: actions/upload-artifact@v4
        with:
          name: Constellation-Commander-v0.7.0-Windows
          path: |
            commander-source/constellation-commander-v0.7.0/dist-electron/*.exe
            commander-source/constellation-commander-v0.7.0/dist-electron/*.zip
            commander-source/constellation-commander-v0.7.0/dist-electron/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
