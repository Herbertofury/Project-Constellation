name: ChatGPT Scheduled Task UI Rescue CI

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "tools/chatgpt-ui-rescue/**"
      - ".github/workflows/chatgpt-ui-scheduler-rescue.yml"

permissions:
  contents: read

concurrency:
  group: chatgpt-scheduled-task-ui-rescue-ci
  cancel-in-progress: true

jobs:
  linux-rescue-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install rescue runtime
        working-directory: tools/chatgpt-ui-rescue
        run: npm install --no-audit --no-fund

      - name: Validate JavaScript syntax
        working-directory: tools/chatgpt-ui-rescue
        run: npm run check

      - name: Install Chromium
        working-directory: tools/chatgpt-ui-rescue
        run: npx playwright install --with-deps chromium

      - name: Test complete needs-attention approval and resume flow
        working-directory: tools/chatgpt-ui-rescue
        env:
          CHATGPT_RESCUE_FIXTURE: "1"
          CHATGPT_RESCUE_REPORT: fixture-report.json
        run: |
          npm run rescue
          node -e 'const r=require("./fixture-report.json"); if(r.status!=="success" || r.repaired_cards.length<1 || r.remaining_blocked_cards.length) process.exit(1); console.log(r);'

      - name: Test real Chrome CDP attachment and rescue
        working-directory: tools/chatgpt-ui-rescue
        run: npm run test:cdp

  windows-syntax:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate local agent JavaScript
        working-directory: tools/chatgpt-ui-rescue
        shell: pwsh
        run: |
          npm install --no-audit --no-fund
          node --check local-agent.mjs
          node --check rescue.mjs

      - name: Install Chromium for Windows CDP test
        working-directory: tools/chatgpt-ui-rescue
        shell: pwsh
        run: npx playwright install chromium

      - name: Test real Chrome CDP attachment on Windows
        working-directory: tools/chatgpt-ui-rescue
        shell: pwsh
        run: npm run test:cdp

      - name: Install, register, verify, and remove local Windows rescue agent
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $testDir = Join-Path $env:RUNNER_TEMP "ChatGPTRescueAgent"
          $taskName = "Project Constellation - ChatGPT Scheduled Rescue CI"
          & "./tools/chatgpt-ui-rescue/install-local-agent.ps1" -InstallDir $testDir -TaskName $taskName -SkipStart
          $task = Get-ScheduledTask -TaskName $taskName -ErrorAction Stop
          if (-not $task) { throw "Installer did not register the Scheduled Task." }
          $config = Join-Path $testDir "agent-config.json"
          if (-not (Test-Path $config)) { throw "Installer did not create agent-config.json." }
          & "./tools/chatgpt-ui-rescue/uninstall-local-agent.ps1" -InstallDir $testDir -TaskName $taskName -RemoveChromeProfile
          if (Get-ScheduledTask -TaskName $taskName -ErrorAction SilentlyContinue) {
            throw "Uninstaller left the test Scheduled Task registered."
          }

      - name: Parse Windows rescue scripts
        shell: pwsh
        run: |
          $files = @(
            "tools/chatgpt-ui-rescue/bootstrap-existing-chrome.ps1",
            "tools/chatgpt-ui-rescue/bootstrap-auth.ps1",
            "tools/chatgpt-ui-rescue/install-local-agent.ps1",
            "tools/chatgpt-ui-rescue/status-local-agent.ps1",
            "tools/chatgpt-ui-rescue/uninstall-local-agent.ps1"
          )
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($file, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error "$file : $($_.Message)" }
              exit 1
            }
          }
