name: ChatGPT Scheduled Task UI Rescue

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      target_tasks:
        description: "Optional comma-separated Scheduled task titles to repair"
        required: false
        default: ""
  push:
    branches: [main]
    paths:
      - "tools/chatgpt-ui-rescue/**"
      - ".github/workflows/chatgpt-ui-scheduler-rescue.yml"

permissions:
  contents: read

concurrency:
  group: chatgpt-scheduled-task-ui-rescue-v2
  cancel-in-progress: true

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate rescue worker JavaScript
        working-directory: tools/chatgpt-ui-rescue
        run: |
          npm install --no-audit --no-fund
          npm run check

      - name: Install Chromium for fixture test
        working-directory: tools/chatgpt-ui-rescue
        run: npx playwright install --with-deps chromium

      - name: Test complete needs-attention approval and resume flow
        working-directory: tools/chatgpt-ui-rescue
        env:
          CHATGPT_RESCUE_FIXTURE: "1"
          CHATGPT_RESCUE_REPORT: fixture-report.json
        run: |
          npm run rescue
          node -e 'const r=require("./fixture-report.json"); if(r.status!=="success" || r.repaired_cards.length<1 || r.remaining_blocked_cards.length) process.exit(1); console.log(r);'

  windows-syntax:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse Windows bootstrap scripts
        shell: pwsh
        run: |
          $files = @(
            "tools/chatgpt-ui-rescue/bootstrap-existing-chrome.ps1",
            "tools/chatgpt-ui-rescue/bootstrap-auth.ps1"
          )
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($file, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error $_.Message }
              exit 1
            }
          }

  rescue:
    if: github.event_name != 'push'
    needs: syntax
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - name: Require encrypted ChatGPT browser state
        shell: bash
        env:
          CHATGPT_STORAGE_STATE_GZ_B64: ${{ secrets.CHATGPT_STORAGE_STATE_GZ_B64 }}
          CHATGPT_STORAGE_STATE_B64: ${{ secrets.CHATGPT_STORAGE_STATE_B64 }}
        run: |
          set -euo pipefail
          if [ -n "$CHATGPT_STORAGE_STATE_GZ_B64" ]; then
            printf '%s' "$CHATGPT_STORAGE_STATE_GZ_B64" | base64 --decode > "$RUNNER_TEMP/chatgpt-storage-state.json.gz"
            gzip -dc "$RUNNER_TEMP/chatgpt-storage-state.json.gz" > "$RUNNER_TEMP/chatgpt-storage-state.json"
            rm -f "$RUNNER_TEMP/chatgpt-storage-state.json.gz"
          elif [ -n "$CHATGPT_STORAGE_STATE_B64" ]; then
            printf '%s' "$CHATGPT_STORAGE_STATE_B64" | base64 --decode > "$RUNNER_TEMP/chatgpt-storage-state.json"
          else
            echo "::error::Missing ChatGPT browser-state secret. Connect the remote-PC bridge and run tools/chatgpt-ui-rescue/bootstrap-existing-chrome.ps1."
            exit 2
          fi
          chmod 600 "$RUNNER_TEMP/chatgpt-storage-state.json"

      - name: Install browser rescue runtime
        working-directory: tools/chatgpt-ui-rescue
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Repair blocked Scheduled task cards
        working-directory: tools/chatgpt-ui-rescue
        env:
          CHATGPT_STORAGE_STATE: ${{ runner.temp }}/chatgpt-storage-state.json
          CHATGPT_TARGET_TASKS: ${{ inputs.target_tasks }}
          CHATGPT_RESCUE_REPORT: chatgpt-ui-rescue-report.json
          CHATGPT_HEADLESS: "false"
        run: xvfb-run -a npm run rescue

      - name: Summarize rescue result
        if: always()
        working-directory: tools/chatgpt-ui-rescue
        shell: bash
        run: |
          if [ -f chatgpt-ui-rescue-report.json ]; then
            python - <<'PY'
          import json
          from pathlib import Path
          p = Path("chatgpt-ui-rescue-report.json")
          data = json.loads(p.read_text(encoding="utf-8"))
          print("status:", data.get("status"))
          print("blocked_cards_found:", data.get("blocked_cards_found"))
          print("repaired_cards:", [x.get("title") for x in data.get("repaired_cards", [])])
          print("remaining_blocked_cards:", data.get("remaining_blocked_cards", []))
          print("errors:", [x.get("stage") + ": " + x.get("message", "")[:160] for x in data.get("errors", [])])
          PY
          else
            echo "No rescue report was produced."
          fi

      - name: Remove local browser state
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/chatgpt-storage-state.json"
