name: ChatGPT UI Rescue Auth Probe

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/chatgpt-ui-auth-probe.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Check encrypted ChatGPT browser state secret
        shell: bash
        env:
          CHATGPT_STORAGE_STATE_GZ_B64: ${{ secrets.CHATGPT_STORAGE_STATE_GZ_B64 }}
          CHATGPT_STORAGE_STATE_B64: ${{ secrets.CHATGPT_STORAGE_STATE_B64 }}
        run: |
          set -euo pipefail
          if [ -n "$CHATGPT_STORAGE_STATE_GZ_B64" ]; then
            echo "Compressed ChatGPT browser-state secret is configured."
          elif [ -n "$CHATGPT_STORAGE_STATE_B64" ]; then
            echo "Legacy ChatGPT browser-state secret is configured."
          else
            echo "::error::No ChatGPT browser-state secret is configured."
            exit 2
          fi
